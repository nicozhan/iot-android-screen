<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>VendSolution · 批量分类</title>
<link rel="stylesheet" href="../shared/style.css">

<body>
<div class="vs-canvas">

<div class="vs-main" style="gap:12px;opacity:.45;pointer-events:none">
  <div class="pm-sku-list"><a class="pm-sku on"><div class="pm-sku-check">&#10003;</div><div class="pm-sku-name">可口可乐</div><div class="pm-sku-id">SKU001</div><div class="pm-sku-tags"><span class="pm-mini-tag">饮料</span></div></a><a class="pm-sku on"><div class="pm-sku-check">&#10003;</div><div class="pm-sku-name">雪碧</div><div class="pm-sku-id">SKU002</div><div class="pm-sku-tags"><span class="pm-mini-tag">饮料</span></div></a><a class="pm-sku on"><div class="pm-sku-check">&#10003;</div><div class="pm-sku-name">美式</div><div class="pm-sku-id">SKU003</div><div class="pm-sku-tags"><span class="pm-mini-tag">咖啡</span></div></a><a class="pm-sku on"><div class="pm-sku-check">&#10003;</div><div class="pm-sku-name">拿铁</div><div class="pm-sku-id">SKU004</div><div class="pm-sku-tags"><span class="pm-mini-tag">咖啡</span></div></a><a class="pm-sku"><div class="pm-sku-check"></div><div class="pm-sku-name">矿泉水</div><div class="pm-sku-id">SKU005</div></a><a class="pm-sku"><div class="pm-sku-check"></div><div class="pm-sku-name">橙汁</div><div class="pm-sku-id">SKU006</div></a><a class="pm-sku"><div class="pm-sku-check"></div><div class="pm-sku-name">薯片1</div><div class="pm-sku-id">SKU007</div></a><a class="pm-sku"><div class="pm-sku-check"></div><div class="pm-sku-name">薯片2</div><div class="pm-sku-id">SKU008</div></a><a class="pm-sku"><div class="pm-sku-check"></div><div class="pm-sku-name">薯片3</div><div class="pm-sku-id">SKU009</div></a><a class="pm-sku"><div class="pm-sku-check"></div><div class="pm-sku-name">薯片4</div><div class="pm-sku-id">SKU010</div></a></div>
</div>
<div class="vs-overlay">
  <div class="vs-modal" style="width:560px">
    <div class="vs-modal-head"><div class="vs-modal-title">批量管理 SKU 分类</div><button class="vs-modal-close" data-close-go="50-products-category-1.html">&#10005;</button></div>
    <div class="vs-modal-body">
      <div class="pm-note">已选择 12 个 SKU</div>
      <div class="pm-tag-bar"><button class="pm-chip on">咖啡</button><button class="pm-chip on">饮料</button><button class="pm-chip">零食</button><button class="pm-chip">水</button><button class="pm-chip">经典咖啡</button><button class="pm-chip">无分类</button></div>
      <div class="pm-note">已有关联的分类显示为已勾选，可多选</div>
    </div>
    <div class="md-foot"><button class="md-btn md-btn-line" data-close-go="50-products-category-1.html">取消</button><button class="md-btn md-btn-dark" data-act="goto-toast" data-href="50-products-category-1.html" data-toast="已添加分类">确认添加分类</button></div>
  </div>
</div>
</div>
<script src="../shared/i18n.js" defer></script>
<script src="../shared/interactions.js" defer></script>

</html>
