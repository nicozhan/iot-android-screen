<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>整机清洗 · 进行中 · VendSolution</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  .cl-status-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .cl-card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:24px 28px;display:flex;flex-direction:column;gap:12px;}
  .cl-card-label{font-size:15px;color:var(--sub);font-weight:500;}
  .cl-card-value{font-size:32px;font-weight:700;font-family:var(--mono);letter-spacing:-.5px;}
  .cl-card-sub{font-size:14px;color:var(--aux);}
  .cl-card-sub .mono{color:var(--ink);font-weight:600;}
  .cl-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .cl-section-head .vs-section-title{margin-bottom:0;}
  .cl-link{font-size:15px;color:var(--blue);font-weight:600;}
  .cl-strategy-card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:24px 28px;display:flex;align-items:center;gap:64px;}
  .cl-strategy-cur{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:700;}
  .cl-dot-on{width:14px;height:14px;border-radius:50%;background:var(--green);}
  .cl-strategy-item{font-size:15px;color:var(--sub);}
  .cl-strategy-item b{color:var(--ink);font-weight:600;margin-left:6px;}
  .cl-actions{display:flex;flex-direction:column;gap:14px;}
  .cl-action-btn{height:76px;background:var(--card);border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:19px;font-weight:600;color:var(--ink);position:relative;overflow:hidden;}
  .cl-action-btn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--green);}
  .cl-action-btn .arrow{color:var(--aux);font-size:18px;}

  .vs-overlay{position:absolute;inset:0;background:transparent;display:flex;align-items:center;justify-content:center;z-index:10;}
  .vs-modal{width:560px;background:var(--card);border:1px solid var(--ink);border-radius:6px;overflow:hidden;}
  .vs-modal-head{height:64px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);font-size:18px;font-weight:700;}
  .vs-modal-body{padding:40px 48px 36px;display:flex;flex-direction:column;align-items:center;gap:18px;}
  .cl-step{font-size:15px;color:var(--sub);}
  .cl-step .mono{font-weight:700;color:var(--ink);font-size:16px;}
  .cl-task{font-size:24px;font-weight:700;}
  .cl-progress{width:100%;height:14px;background:var(--track);border-radius:7px;overflow:hidden;}
  .cl-progress-bar{height:100%;width:60%;background:var(--green);border-radius:7px;}
  .cl-pct{font-family:var(--mono);font-size:16px;font-weight:700;}
  .cl-warn{font-size:14px;color:var(--orange);font-weight:600;}
  .vs-modal-foot{display:flex;justify-content:center;padding:0 40px 36px;}
  .cl-stop-btn{width:240px;height:56px;background:var(--card);border:1px solid var(--red);border-radius:4px;color:var(--red);font-size:17px;font-weight:600;font-family:var(--sans);cursor:pointer;}
</style>
</head>
<body>
<div class="vs-canvas" style="position:relative;">

  <div class="vs-topbar">
    <button class="vs-btn-line" data-href="01-beats-home.html">← 返回首页</button>
    <div class="page-title">清洗</div>
  </div>

  <div class="vs-main" style="gap:24px;">
    <section>
      <div class="cl-section-head"><div class="vs-section-title">清洗状态</div></div>
      <div class="cl-status-grid">
        <div class="cl-card">
          <div class="cl-card-label">上次清洗时间</div>
          <div class="cl-card-value">2026/08/28 14:30</div>
          <div class="cl-card-sub">整机清洗 · 自动执行</div>
        </div>
        <div class="cl-card">
          <div class="cl-card-label">距下次清洗</div>
          <div class="cl-card-value">12 小时</div>
          <div class="cl-card-sub">或 <span class="mono">86</span> 杯（以先到者为准）</div>
        </div>
      </div>
    </section>
    <section>
      <div class="cl-section-head"><div class="vs-section-title">清洗策略</div><a class="cl-link">修改策略 →</a></div>
      <div class="cl-strategy-card">
        <div class="cl-strategy-cur"><span class="cl-dot-on"></span>当前策略：自动</div>
        <div class="cl-strategy-item">清洗方式<b>按定时</b></div>
        <div class="cl-strategy-item">清洗周期<b class="mono">每日 02:00</b></div>
      </div>
    </section>
    <section style="flex:1;display:flex;flex-direction:column;">
      <div class="cl-section-head"><div class="vs-section-title">清洗动作</div></div>
      <div class="cl-actions">
        <button class="cl-action-btn">整机清洗<span class="arrow">→</span></button>
        <button class="cl-action-btn">右搅拌器清洗<span class="arrow">→</span></button>
        <button class="cl-action-btn">冲泡器清洗<span class="arrow">→</span></button>
        <button class="cl-action-btn">清洗鲜奶系统<span class="arrow">→</span></button>
        <button class="cl-action-btn">左搅拌器清洗<span class="arrow">→</span></button>
      </div>
    </section>
  </div>

  <!-- 整机清洗进行中弹窗 -->
  <div class="vs-overlay">
    <div class="vs-modal">
      <div class="vs-modal-head">整机清洗</div>
      <div class="vs-modal-body">
        <div class="cl-step">正在清洗 <span class="mono">② / ⑤</span></div>
        <div class="cl-task">冲洗冲泡器</div>
        <div class="cl-progress"><div class="cl-progress-bar"></div></div>
        <div class="cl-pct">60%</div>
        <div class="cl-warn">请勿操作机器</div>
      </div>
      <div class="vs-modal-foot">
        <button class="cl-stop-btn" data-close-go="16-cleaning.html" data-toast="已停止清洗">停止</button>
      </div>
    </div>
  </div>

</div>
<script src="../shared/interactions.js" defer></script>
</body>
</html>
