<style>
  .wc-header{
    height:72px;flex:0 0 72px;display:flex;align-items:center;
    padding:0 32px;background:var(--card);border-bottom:1px solid var(--line);
  }
  .wc-title{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px;}
  .wc-back{
    margin-left:auto;font-size:15px;color:var(--sub);cursor:pointer;
    display:flex;align-items:center;gap:6px;
  }
  .wc-back:hover{color:var(--ink);}

  .wc-tabs{
    display:flex;gap:14px;padding:18px 32px;background:var(--card);
    border-bottom:1px solid var(--line);flex:0 0 auto;
  }
  .wc-tab{
    height:44px;padding:0 22px;background:var(--card);
    border:1px solid var(--line-btn);border-radius:4px;
    font-size:15px;font-weight:600;color:var(--ink);cursor:pointer;font-family:var(--sans);
  }
  .wc-tab.active{background:var(--dark);border-color:var(--dark);color:#FFF;}

  .wc-main{flex:1;padding:28px 32px 40px;overflow-y:auto;}
  .wc-kicker{font-family:var(--mono);font-size:13px;letter-spacing:2px;color:var(--aux);margin-bottom:8px;}
  .wc-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;}
  .wc-h1{font-size:26px;font-weight:700;}
  .wc-count{font-size:15px;font-weight:600;color:var(--sub);}

  .wc-card{
    background:var(--card);border:1px solid var(--ink);border-radius:6px;
    padding:26px 28px;margin-bottom:22px;position:relative;
  }
  .wc-card-title{font-size:20px;font-weight:700;margin-bottom:18px;}
  .wc-label{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:10px;}
  .wc-input{
    width:220px;height:56px;border:1px solid var(--line-btn);border-radius:4px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 18px;font-size:18px;font-family:var(--mono);font-weight:600;background:var(--card);
  }
  .wc-input .unit{font-family:var(--sans);font-weight:500;color:var(--sub);font-size:15px;}
  .wc-note{font-size:14px;color:var(--aux);margin-top:14px;}
  .wc-note .mono{color:var(--sub);font-weight:500;}
  .wc-test{
    position:absolute;right:28px;top:50%;transform:translateY(-50%);
    width:96px;height:52px;background:var(--card);
    border:1px solid var(--line-btn);border-radius:4px;
    font-size:16px;font-weight:600;color:var(--ink);cursor:pointer;font-family:var(--sans);
  }
  .wc-test:hover{background:#F0F0EC;}
</style>
</head>
