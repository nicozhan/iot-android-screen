<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>VendSolution · 测试出货</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  /* 本页：分类行为导航入口（不拖拽），沿用 pm-cat-row 规格 */
  .pm-cat-row{cursor:pointer;}
  .pm-cat-row:hover{background:#FCFCFA;}
  .pm-cat-go{color:var(--aux);font-size:18px;flex:0 0 24px;text-align:center;}
</style>
</head>
<body>
<div class="vs-canvas">

  <div class="vs-topbar">
    <button class="vs-btn-line" data-href="31-eng-settings.html">&#8592;&nbsp;返回高级设置</button>
    <div class="page-title">测试出货</div>
  </div>

  <main class="vs-main" style="gap:14px">
    <div class="pm-note">选择商品分类，进入后点击「出货」可测试对应货道</div>
    <div class="pm-cat-list">
      <div class="pm-cat-row" data-href="32b-eng-unit-test-lanes.html"><span class="pm-cat-name">咖啡</span><span class="pm-cat-count">12 个货道</span><span class="pm-cat-go">&#8250;</span></div>

      <div class="pm-cat-row" data-href="32b-eng-unit-test-lanes.html"><span class="pm-cat-name">奶茶</span><span class="pm-cat-count">9 个货道</span><span class="pm-cat-go">&#8250;</span></div>
      <div class="pm-cat-row" data-href="32b-eng-unit-test-lanes.html"><span class="pm-cat-name">其他</span><span class="pm-cat-count">4 个货道</span><span class="pm-cat-go">&#8250;</span></div>
    </div>
  </main>
</div>
<script src="../shared/interactions.js" defer></script>

</html>
