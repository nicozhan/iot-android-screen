<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>VendSolution · 标签管理</title>
<link rel="stylesheet" href="../shared/style.css">
<style></style>
</head>
<body>
<div class="vs-canvas">
<div class="vs-topbar"><a class="vs-btn-line" href="36-products.html">&#8592;&nbsp;返回</a><div class="page-title">标签管理</div><button class="vs-btn-line" style="margin-left:auto" data-href="36-products.html">完成</button></div>
<main class="vs-main" style="gap:14px">
  <div class="pm-tag-bar"><button class="pm-chip on">全部</button><button class="pm-chip">无分类</button><button class="pm-chip">咖啡</button><button class="pm-chip">饮料</button><button class="pm-chip">零食</button><button class="pm-chip">水</button></div>
  <div class="pm-note">全选当前结果（50 个 SKU）</div>
  <div class="pm-sku-list"><a class="pm-sku on"><div class="pm-sku-check">&#10003;</div><div class="pm-sku-name">可口可乐</div><div class="pm-sku-id">SKU001</div><div class="pm-sku-tags"><span class="pm-mini-tag">热销</span></div></a><a class="pm-sku on"><div class="pm-sku-check">&#10003;</div><div class="pm-sku-name">雪碧</div><div class="pm-sku-id">SKU002</div><div class="pm-sku-tags"><span class="pm-mini-tag">促销</span></div></a><a class="pm-sku on"><div class="pm-sku-check">&#10003;</div><div class="pm-sku-name">美式</div><div class="pm-sku-id">SKU003</div><div class="pm-sku-tags"><span class="pm-mini-tag">推荐</span></div></a><a class="pm-sku on"><div class="pm-sku-check">&#10003;</div><div class="pm-sku-name">拿铁</div><div class="pm-sku-id">SKU004</div><div class="pm-sku-tags"><span class="pm-mini-tag">新品</span></div></a><a class="pm-sku"><div class="pm-sku-check"></div><div class="pm-sku-name">矿泉水</div><div class="pm-sku-id">SKU005</div></a><a class="pm-sku"><div class="pm-sku-check"></div><div class="pm-sku-name">橙汁</div><div class="pm-sku-id">SKU006</div></a><a class="pm-sku"><div class="pm-sku-check"></div><div class="pm-sku-name">薯片1</div><div class="pm-sku-id">SKU007</div></a><a class="pm-sku"><div class="pm-sku-check"></div><div class="pm-sku-name">薯片2</div><div class="pm-sku-id">SKU008</div></a><a class="pm-sku"><div class="pm-sku-check"></div><div class="pm-sku-name">薯片3</div><div class="pm-sku-id">SKU009</div></a><a class="pm-sku"><div class="pm-sku-check"></div><div class="pm-sku-name">薯片4</div><div class="pm-sku-id">SKU010</div></a></div>
  <div class="pm-note">已选 12 个</div>
</main>
<div class="vs-footer">
  <button class="vs-btn-line" data-modal="#tag-modal">添加标签</button>
  <button class="vs-btn-line" data-op="remove-tags">移除标签</button>
  <button class="vs-save-btn" data-op="clear-sel">全部清除</button>
</div>
</div>

<!-- 浮层 · tag-modal（源自 51-products-category-2.html，深链仍可访问） -->
<div class="vs-overlay" id="tag-modal">
  <div class="vs-modal" style="width:560px">
    <div class="vs-modal-head"><div class="vs-modal-title">批量管理 SKU 标签</div><button class="vs-modal-close" data-close-hide>&#10005;</button></div>
    <div class="vs-modal-body">
      <div class="pm-note">已选择 12 个 SKU</div>
      <div class="pm-tag-bar"><button class="pm-chip on">热销</button><button class="pm-chip on">新品</button><button class="pm-chip on">促销</button><button class="pm-chip on">推荐</button><button class="pm-chip">早餐</button><button class="pm-chip">低糖</button><button class="pm-chip">常温</button><button class="pm-chip">冷藏</button></div>
      <div class="pm-note">已有关联的标签显示为已勾选</div>
    </div>
    <div class="md-foot"><button class="md-btn md-btn-line" data-close-hide>取消</button><button class="md-btn md-btn-dark" data-close-all data-toast="已添加标签">确认添加标签</button></div>
  </div>
</div>

<script src="../shared/interactions.js" defer></script>
</body>
</html>
