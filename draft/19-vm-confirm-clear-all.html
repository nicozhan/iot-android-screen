<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>VendSolution Console · 售卖机补货 / 全部清空</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  /* ---- 统一弹窗（与商品页同套） ---- */
  .vs-overlay{position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:10;}
  .vs-modal{width:520px;background:var(--card);border:1px solid var(--ink);border-radius:6px;overflow:hidden;}
  .vs-modal-head{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);font-size:17px;font-weight:700;}
  .vs-modal-close{font-size:18px;color:var(--aux);cursor:pointer;background:none;border:none;line-height:1;}
  .vs-modal-body{padding:28px;font-size:17px;font-weight:600;color:var(--ink);line-height:1.7;}
  .md-foot{display:flex;justify-content:flex-end;gap:14px;padding:0 28px 28px;}
  .md-btn{height:52px;padding:0 34px;border-radius:4px;font-size:16px;font-weight:600;font-family:var(--sans);cursor:pointer;border:1px solid transparent;}
  .md-btn-line{background:var(--card);border-color:var(--line-btn);color:var(--ink);}
  .md-btn-green{background:var(--card);border-color:var(--green);color:var(--green);}
  .md-btn-orange{background:var(--card);border-color:var(--orange);color:var(--orange);}
  .md-btn-pink{background:var(--card);border-color:#EE3372;color:#EE3372;}
</style>
</head>
<body>
<div class="vs-canvas">

  <div class="vs-topbar">
    <button class="vs-btn-line">&#8592;&nbsp;返回导航</button>
    <div class="page-title">全部清空</div>
  </div>

  <div class="vs-overlay">
    <div class="vs-modal">
      <div class="vs-modal-head">全部清空<span class="vs-modal-close">&#10005;</span></div>
      <div class="vs-modal-body">确定将所有货道「全部清空」吗？</div>
      <div class="md-foot">
        <button class="md-btn md-btn-line">取消</button>
        <button class="md-btn md-btn-orange">全部清空</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
