<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>VendSolution · 测试出货</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  /* ---- 货道列表：沿用 pm-sort 卡片规格，序号位改为货道号，操作位改为「出货」 ---- */
  .pm-lane-list{display:flex;flex-direction:column;gap:12px;}
  .pm-lane-card{display:flex;align-items:center;gap:16px;height:76px;background:var(--card);
    border:1px solid var(--line);border-radius:6px;padding:0 20px;}
  .pm-lane-no{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--sub);flex:0 0 44px;}
  .pm-lane-thumb{width:52px;height:52px;flex:0 0 52px;background:var(--track);border-radius:4px;
    display:flex;align-items:center;justify-content:center;color:var(--aux);font-size:12px;}
  .pm-lane-name{flex:1;font-size:18px;font-weight:600;}
  .pm-ship-btn{flex:0 0 auto;height:40px;padding:0 22px;background:var(--card);
    border:1px solid var(--line-btn);border-radius:4px;font-size:14px;font-weight:600;
    color:var(--ink);font-family:var(--sans);cursor:pointer;}
  .pm-ship-btn:hover{background:#F0F0EC;}

  /* ---- 出货中进度条 ---- */
  .ship-bar{height:10px;background:var(--track);border-radius:5px;overflow:hidden;margin:20px 0 6px;}
  .ship-bar-fill{display:block;height:100%;width:0%;background:var(--dark);border-radius:5px;}

  /* ---- 页内弹窗（沿用全站组件样式） ---- */
  .vs-overlay{position:absolute;inset:0;background:transparent;display:none;align-items:center;justify-content:center;z-index:50;}
  .vs-overlay.show{display:flex;}
  .vs-modal{width:480px;background:var(--card);border:1px solid var(--ink);border-radius:6px;overflow:hidden;padding:26px 28px 28px;}
  .modal-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px;}
  .modal-tag{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:2px;color:var(--orange);}
  .vs-modal-close{background:none;border:none;font-size:18px;color:var(--aux);cursor:pointer;line-height:1;padding:2px;}
  .modal-title{font-size:20px;font-weight:700;}
  .modal-divider{border:none;border-top:1px solid var(--line);margin:16px 0 20px;}
  .modal-desc{font-size:16px;color:var(--ink);line-height:1.7;}
  .modal-sub{font-size:14px;color:var(--sub);margin-top:10px;}
  .md-foot{display:flex;justify-content:center;gap:14px;margin-top:26px;}
  .md-btn{height:52px;padding:0 28px;border-radius:4px;font-size:16px;font-weight:600;font-family:var(--sans);cursor:pointer;border:1px solid transparent;}
  .md-btn-line{background:var(--card);border-color:var(--line-btn);color:var(--ink);}
  .md-btn-dark{background:var(--dark);border-color:var(--dark);color:#FFFFFF;}
  .md-btn-orange{background:var(--card);border-color:var(--orange);color:var(--orange);}

  /* ---- 二次配置（出货前） ---- */
  .cfg-name{font-size:14px;color:var(--sub);margin-bottom:16px;}
  .cfg-name b{color:var(--ink);font-weight:600;}
  .cfg-hint{font-size:14px;color:var(--ink);margin-bottom:14px;}
  .cfg-row{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
  .cfg-label{flex:0 0 64px;font-size:16px;font-weight:600;}
  .cfg-opts{display:flex;gap:10px;flex-wrap:wrap;}
  .cfg-opt{height:38px;min-width:56px;padding:0 16px;border:1px solid var(--line-btn);border-radius:4px;
    background:var(--card);font-size:15px;font-family:var(--sans);color:var(--ink);cursor:pointer;}
  .cfg-opt:hover{background:#F0F0EC;}
  .cfg-opt.on{background:var(--dark);border-color:var(--dark);color:#FFFFFF;}

  /* ---- 出货中：左侧进度 + 右侧 IoT 日志 ---- */
  #ship-running .vs-modal{width:700px;}
  .ship-run-body{display:flex;gap:22px;align-items:stretch;}
  .ship-run-left{flex:1;min-width:0;}
  .ship-run-right{flex:0 0 268px;display:flex;flex-direction:column;}
  .ship-cfg-readout{font-size:14px;color:var(--sub);margin:14px 0 4px;}
  .iot-head{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;
    padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--line);}
  .iot-dot{width:8px;height:8px;border-radius:50%;background:var(--orange);animation:iotpulse 1.1s infinite;}
  @keyframes iotpulse{0%{opacity:.3;}50%{opacity:1;}100%{opacity:.3;}}
  .iot-log{height:300px;overflow-y:auto;font-family:var(--mono);font-size:12px;line-height:1.55;
    background:var(--track);border:1px solid var(--line);border-radius:4px;padding:10px 12px;color:var(--ink);}
  .iot-line{white-space:pre-wrap;word-break:break-all;}
  .iot-time{color:var(--sub);}
  .iot-sev{font-weight:700;margin-right:6px;}
  .sev-info{color:#2B6CB0;}
  .sev-ok{color:#2F855A;}
  .sev-warn{color:#C05621;}
  .sev-err{color:#C53030;}
  .sev-cfg{color:#6B46C1;}
</style>
</head>
<body>
<div class="vs-canvas">

  <div class="vs-topbar">
    <button class="vs-btn-line" data-href="32-eng-unit-test.html">&#8592;&nbsp;返回</button>
    <div class="page-title">测试出货</div>
  </div>

  <main class="vs-main" style="gap:14px;overflow-y:auto;">
    <section>
      <div class="vs-section-title" id="lane-title">咖啡 · 12 个货道</div>
      <div class="pm-note">点击「出货」按钮测试对应货道；出货过程中可随时终止</div>
      <div class="pm-lane-list" id="lane-list"></div>
    </section>
  </main>

  <!-- 弹窗1：测试出货 · 二次配置 -->
  <div class="vs-overlay" id="ship-confirm">
    <div class="vs-modal">
      <div class="modal-head">
        <div>
          <div class="modal-tag">CONFIG</div>
          <div class="modal-title" style="margin-top:6px">测试出货</div>
        </div>
        <button class="vs-modal-close" data-close-hide>&#10005;</button>
      </div>
      <hr class="modal-divider">
      <div class="cfg-name">商品：<b id="cfg-name">美式</b></div>
      <div class="cfg-hint">请确认出货配置</div>
      <div class="cfg-block">
        <div class="cfg-row" data-coffee-only>
          <div class="cfg-label">咖啡量</div>
          <div class="cfg-opts" data-def="中">
            <button class="cfg-opt" data-val="少">少</button>
            <button class="cfg-opt" data-val="中">中</button>
            <button class="cfg-opt" data-val="多">多</button>
          </div>
        </div>
        <div class="cfg-row">
          <div class="cfg-label">温度</div>
          <div class="cfg-opts" data-def="热">
            <button class="cfg-opt" data-val="热">热</button>
            <button class="cfg-opt" data-val="冷">冷</button>
          </div>
        </div>
        <div class="cfg-row" data-coffee-only>
          <div class="cfg-label">糖</div>
          <div class="cfg-opts" data-def="无">
            <button class="cfg-opt" data-val="无">无</button>
            <button class="cfg-opt" data-val="少">少</button>
            <button class="cfg-opt" data-val="中">中</button>
            <button class="cfg-opt" data-val="多">多</button>
          </div>
        </div>
      </div>
      <div class="md-foot">
        <button class="md-btn md-btn-line" data-close-hide>取消</button>
        <button class="md-btn md-btn-dark" data-ship-go="#ship-running" data-ship-done="#ship-done">测试出货</button>
      </div>
    </div>
  </div>

  <!-- 弹窗2：出货中（可终止，右侧系统 IoT 日志） -->
  <div class="vs-overlay" id="ship-running">
    <div class="vs-modal">
      <div class="modal-head">
        <div>
          <div class="modal-tag">SHIPPING</div>
          <div class="modal-title" style="margin-top:6px">出货中</div>
        </div>
      </div>
      <hr class="modal-divider">
      <div class="ship-run-body">
        <div class="ship-run-left">
          <div class="modal-desc" data-ship-text="running">货道正在出货…</div>
          <div class="ship-cfg-readout" id="ship-cfg-readout"></div>
          <div class="ship-bar"><span class="ship-bar-fill"></span></div>
          <div class="md-foot" style="justify-content:flex-start;margin-top:18px;">
            <button class="md-btn md-btn-orange" data-ship-stop="#ship-running">终止出货</button>
          </div>
        </div>
        <div class="ship-run-right">
          <div class="iot-head"><span class="iot-dot"></span>系统 IoT 日志</div>
          <div class="iot-log" id="iot-log"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 弹窗3：出货完成 -->
  <div class="vs-overlay" id="ship-done" data-modal-safe>
    <div class="vs-modal">
      <div class="modal-head">
        <div>
          <div class="modal-tag">DONE</div>
          <div class="modal-title" style="margin-top:6px">出货完成</div>
        </div>
      </div>
      <hr class="modal-divider">
      <div class="modal-desc" data-ship-text="done">货道测试出货完成</div>
      <div class="modal-sub" id="done-cfg"></div>
      <div class="md-foot">
        <button class="md-btn md-btn-dark" data-close-hide>确定</button>
      </div>
    </div>
  </div>
</div>

<script>
/* 按分类渲染货道卡片（原型演示数据；分类由上一页经 sessionStorage vs-ctx 传入）。 */
(function () {
  function T(x){ return window.I18N ? window.I18N.t(x) : x; }
  var CATS = {
    '咖啡': ['美式', '拿铁', '卡布奇诺', '摩卡', '澳白', '冰美式', '燕麦拿铁', '香草拿铁', '焦糖玛奇朵', '抹茶拿铁', '椰奶咖啡', '浓缩'],
    '饮料': ['可乐', '雪碧', '芬达', '美年达', '冰红茶', '冰绿茶', '茉莉花茶', '酸梅汤', '橙汁', '苹果汁', '葡萄汁', '柠檬茶', '椰子水', '苏打水', '能量饮料', '乌龙茶', '玉米汁', '胡萝卜汁'],
    '零食': ['薯片', '巧克力威化', '饼干', '牛角包', '奶油蛋糕', '混合坚果', '果冻', '牛奶糖', '口香糖', '牛肉干', '小鱼干', '豆干', '海苔', '瓜子', '花生', '蚕豆', '雪饼', '仙贝', '蛋卷', '沙琪玛', '爆米花', '冰淇淋', '棉花糖', '南瓜子', '杏仁'],
    '水': ['矿泉水', '纯净水', '气泡水', '薄荷水', '柠檬水', '山泉水', '矿物质水', '薄荷柠水'],
    '早餐': ['三明治', '饭团', '肉包', '菜包', '米糕', '南瓜饼'],
    '奶茶': ['珍珠奶茶', '椰果奶茶', '红豆奶茶', '布丁奶茶', '仙草奶茶', '抹茶奶茶', '燕麦奶茶', '黑糖奶茶', '芝士奶茶'],
    '其他': ['纸巾', '湿巾', '口罩', '电池']
  };
  var cat = '咖啡';
  try {
    var ctx = JSON.parse(sessionStorage.getItem('vs-ctx') || 'null');
    if (ctx && ctx.name && CATS[ctx.name]) cat = ctx.name;
  } catch (e) {}
  window.__cat = cat;
  var keys = Object.keys(CATS);
  var catIdx = keys.indexOf(cat) + 1;
  var names = CATS[cat];
  var html = '';
  for (var i = 0; i < names.length; i++) {
    html += '<div class="pm-lane-card">' +
      '<span class="pm-lane-no">' + catIdx + '-' + (i + 1) + '</span>' +
      '<div class="pm-lane-thumb">' + T('商品图片') + '</div>' +
      '<div class="pm-lane-name">' + names[i] + '</div>' +
      '<button class="pm-ship-btn" data-ship="#ship-confirm">' + T('出货') + '</button>' +
      '</div>';
  }
  document.getElementById('lane-list').innerHTML = html;
  var title = document.getElementById('lane-title');
  if (title) title.textContent = T(cat) + ' · ' + names.length + ' ' + T('个货道');

  /* 记录被点货道（供二次配置弹窗显示商品名） */
  document.getElementById('lane-list').addEventListener('click', function (e) {
    var btn = e.target.closest('.pm-ship-btn');
    if (!btn) return;
    var card = btn.closest('.pm-lane-card');
    window.__shipName = card ? (card.querySelector('.pm-lane-name') || {}).textContent.trim() : '';
    window.__shipLane = card ? (card.querySelector('.pm-lane-no') || {}).textContent.trim() : '';
    window.__shipCat = cat;
  });

  /* 配置项单选（每组互斥） */
  document.addEventListener('click', function (e) {
    var opt = e.target.closest('.cfg-opt');
    if (!opt) return;
    var opts = opt.parentElement;
    opts.querySelectorAll('.cfg-opt').forEach(function (o) { o.classList.remove('on'); });
    opt.classList.add('on');
  });

  function applyDefaults() {
    document.querySelectorAll('#ship-confirm .cfg-opts').forEach(function (opts) {
      var def = opts.getAttribute('data-def');
      opts.querySelectorAll('.cfg-opt').forEach(function (o) {
        o.classList.toggle('on', o.getAttribute('data-val') === def);
      });
    });
  }
  function readCfg() {
    var c = {};
    document.querySelectorAll('#ship-confirm .cfg-row').forEach(function (row) {
      if (row.style.display === 'none') return;
      var label = (row.querySelector('.cfg-label') || {}).textContent.trim();
      var on = row.querySelector('.cfg-opt.on');
      if (on) c[label] = on.getAttribute('data-val');
    });
    return c;
  }
  function esc(s){ return String(s).replace(/[&<>]/g, function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m];}); }

  function buildLines(cfg, name, lane) {
    var isCoffee = ('咖啡量' in cfg);
    var amt = cfg['咖啡量'], temp = cfg['温度'], sugar = cfg['糖'];
    var amtG = ({'少':12,'中':18,'多':24})[amt] || 18;
    var tempC = (temp === '冷') ? 4 : 94;
    var sugarG = ({'无':0,'少':3,'中':6,'多':9})[sugar] || 0;
    var vol = ({'少':160,'中':200,'多':260})[amt] || 200;
    var L = [];
    L.push(['INFO', 'IoT link up · dev=VM-01 · fw=v2.3.1']);
    L.push(['INFO', 'recipe load · name=' + name + ' · lane=' + lane]);
    if (isCoffee) {
      L.push(['CFG', 'coffee=' + amtG + 'g · temp=' + tempC + '°C · sugar=' + sugarG + 'g']);
      L.push(['INFO', 'grinder ON · target=' + amtG + 'g']);
      L.push(['INFO', (temp === '冷' ? 'chiller set ' : 'boiler set ') + tempC + '°C · ' + (temp === '冷' ? 'cooling' : 'heating')]);
      L.push(['INFO', 'pump ramp → 9.0 bar']);
      L.push(['INFO', 'valve open · flow start']);
      L.push(['INFO', 'flow dispensing · ' + vol + 'ml']);
      L.push(['OK', 'cup detected · drop OK']);
      L.push(['INFO', sugarG > 0 ? ('sugar dose ' + sugarG + 'g') : 'sugar none']);
      L.push(['OK', 'done · cup ready']);
    } else {
      L.push(['CFG', 'temp=' + tempC + '°C']);
      L.push(['INFO', 'actuator ON']);
      L.push(['INFO', 'pump ramp → 9.0 bar']);
      L.push(['INFO', 'valve open · flow start']);
      L.push(['INFO', 'dispensing']);
      L.push(['OK', 'cup ready']);
    }
    return L;
  }

  var iotLog = document.getElementById('iot-log');
  var readout = document.getElementById('ship-cfg-readout');
  var doneCfg = document.getElementById('done-cfg');
  var iotTimer = null, t0 = 0;

  function appendLine(line, idx) {
    var d = new Date(t0 + idx * 220);
    var ts = d.toTimeString().slice(0, 8);
    var div = document.createElement('div');
    div.className = 'iot-line';
    div.innerHTML = '<span class="iot-time">' + ts + '</span> <span class="iot-sev sev-' +
      line[0].toLowerCase() + '">' + line[0] + '</span>' + esc(line[1]);
    iotLog.appendChild(div);
    iotLog.scrollTop = iotLog.scrollHeight;
  }
  function startIot() {
    stopIot();
    var cfg = readCfg();
    var name = window.__shipName || '', lane = window.__shipLane || '';
    var parts = [];
    if (cfg['咖啡量']) parts.push('咖啡量 ' + cfg['咖啡量']);
    if (cfg['温度']) parts.push(cfg['温度']);
    if (cfg['糖']) parts.push('糖 ' + cfg['糖']);
    if (readout) readout.textContent = T('配置') + '：' + parts.join(' · ');
    if (doneCfg) doneCfg.textContent = T('配置') + '：' + parts.join(' · ');
    var lines = buildLines(cfg, name, lane);
    t0 = Date.now();
    var i = 0;
    iotTimer = setInterval(function () {
      if (i >= lines.length) { clearInterval(iotTimer); iotTimer = null; return; }
      appendLine(lines[i], i); i++;
    }, 220);
  }
  function stopIot() {
    if (iotTimer) { clearInterval(iotTimer); iotTimer = null; }
    if (iotLog) iotLog.innerHTML = '';
    if (readout) readout.textContent = '';
  }

  /* 确认弹窗打开时：填商品名、按分类切换咖啡专属配置、重置默认值 */
  var confirmOv = document.getElementById('ship-confirm');
  new MutationObserver(function (muts) {
    muts.forEach(function (m) {
      if (m.attributeName !== 'class') return;
      if (confirmOv.classList.contains('show')) {
        var nm = document.getElementById('cfg-name');
        if (nm) nm.textContent = window.__shipName || T('商品');
        var isCoffee = window.__shipCat === '咖啡';
        document.querySelectorAll('#ship-confirm .cfg-row[data-coffee-only]').forEach(function (r) {
          r.style.display = isCoffee ? 'flex' : 'none';
        });
        applyDefaults();
        if (doneCfg) doneCfg.textContent = '';
      }
    });
  }).observe(confirmOv, { attributes: true });

  /* 出货中弹窗：显示即播日志，隐藏即停；仅「终止」时清空完成页配置读出 */
  var runOv = document.getElementById('ship-running');
  new MutationObserver(function (muts) {
    muts.forEach(function (m) {
      if (m.attributeName !== 'class') return;
      if (runOv.classList.contains('show')) startIot();
      else {
        stopIot();
        if (!document.getElementById('ship-done').classList.contains('show') && doneCfg) doneCfg.textContent = '';
      }
    });
  }).observe(runOv, { attributes: true });
})();
</script>
<script src="../shared/i18n.js" defer></script>
<script src="../shared/interactions.js" defer></script>
</body>
</html>
