<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>VendSolution Console · Beats项目售卖机 · 首页</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<div class="vs-canvas">

  <header class="vs-header">
    <div class="logo">VendSolution</div>
    <div class="h-item"><span class="lbl">设备ID</span><span class="mono">SYD0254</span></div>
    <div class="h-item"><span class="lbl">时间</span><span class="mono">15:55</span></div>
    <div class="h-spacer"></div>
    <div class="h-item right"><span class="lbl">用户</span><b>Adams</b></div>
  </header>

  <main class="vs-main">

    <!-- 设备状态区域 -->
    <section class="vs-status-row">
      <div class="vs-status-left">
        <div class="vs-status-title">
          <span class="vs-lamp"></span>
          设备正常运行
        </div>
        <div class="vs-status-net">
          <span class="vs-net-label">网络</span>
          <span class="vs-net-dots">
            <span class="vs-net-dot"></span>
            <span class="vs-net-dot"></span>
            <span class="vs-net-dot"></span>
            <span class="vs-net-dot"></span>
            <span class="vs-net-dot off"></span>
          </span>
          <span>最后同步：<span class="mono">08/01 13:59</span></span>
        </div>
        <hr class="vs-divider">
        <div class="vs-cups-row">
          <span class="vs-cups-label">今日销量：</span>
          <span class="vs-cups-num">55</span>
        </div>
      </div>

      <div class="vs-status-alerts">
        <div class="vs-alerts-head">
          <span class="vs-alerts-title">告警</span>
          <span class="vs-alerts-badge">3</span>
        </div>
        <div class="vs-alert-item">
          <span class="vs-alert-time">12:10</span>
          <span class="vs-alert-text">纸杯余量不足（18%）</span>
          <span class="vs-alert-arrow">&#8250;</span>
        </div>
        <div class="vs-alert-item">
          <span class="vs-alert-time">09:42</span>
          <span class="vs-alert-text">右搅拌器清洗提醒</span>
          <span class="vs-alert-arrow">&#8250;</span>
        </div>
        <div class="vs-alert-item">
          <span class="vs-alert-time">07-30 22:58</span>
          <span class="vs-alert-text">离线</span>
          <span class="vs-alert-arrow">&#8250;</span>
        </div>
      </div>
    </section>

    <!-- 快捷操作 -->
    <section>
      <div class="vs-section-title">快捷操作</div>
      <div class="vs-quick-grid">
        <button class="vs-quick-btn vs-q-restock">
          <span class="vs-quick-title">补货</span>
          <span class="vs-quick-sub">上次补货：<span class="mono">08/01 11:02</span></span>
        </button>
        <button class="vs-quick-btn vs-q-stats">
          <span class="vs-quick-title">商品排序</span>
        </button>
        <button class="vs-quick-btn vs-q-goods">
          <span class="vs-quick-title">商品价格</span>
        </button>
        <button class="vs-quick-btn vs-q-clean">
          <span class="vs-quick-title">商品分组管理</span>
        </button>
        <button class="vs-quick-btn vs-q-ops">
          <span class="vs-quick-title">测试出货</span>
        </button>
      </div>
    </section>

    <!-- 更多功能 -->
    <section class="vs-more-section">
      <div class="vs-section-title sm">更多功能</div>
      <div class="vs-more-grid">
        <button class="vs-more-btn">基本设置</button>
        <button class="vs-more-btn">账号设置</button>
        <button class="vs-more-btn">预留1</button>
        <button class="vs-more-btn">预留2</button>
        <button class="vs-more-btn">预留3</button>
        <button class="vs-more-btn">预留4</button>
        <button class="vs-more-btn">预留5</button>
      </div>
    </section>

  </main>
</div>
</body>
</html>
