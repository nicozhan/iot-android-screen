<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>VendSolution Console · Beats项目售卖机 · 首页</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
a.vs-quick-btn,a.vs-more-btn{text-decoration:none;}

/* ---- 本页：顶栏均匀分布 ---- */
.vs-header{justify-content:space-between;position:relative;z-index:5;}
.user-entry{cursor:pointer;user-select:none;display:flex;align-items:center;gap:4px;}
.user-caret{font-size:12px;color:var(--sub);margin-left:2px;line-height:1;}

/* ---- 本页：用户下拉菜单 ---- */
.vs-menu{
  position:absolute;top:70px;right:24px;z-index:40;
  min-width:176px;background:var(--card);
  border:1px solid var(--ink);border-radius:6px;
  box-shadow:0 14px 36px rgba(0,0,0,.18);
  display:none;overflow:hidden;
}
.vs-menu.show{display:block;}
.vs-menu-item{
  display:block;width:100%;height:52px;padding:0 20px;
  background:none;border:none;text-align:left;
  font-size:16px;font-weight:500;color:var(--ink);
  font-family:var(--sans);cursor:pointer;
}
.vs-menu-item:hover{background:#F4F4EE;}
.vs-menu-item + .vs-menu-item{border-top:1px solid var(--line);}
.vs-menu-lang{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px 12px 20px;border-bottom:1px solid var(--line);
}
.vs-menu-lang-label{font-size:15px;font-weight:600;color:var(--sub);margin-right:auto;}
.lang-chip{
  min-width:62px;padding:6px 0;text-align:center;
  font-size:14px;font-weight:600;font-family:var(--sans);
  border:1px solid var(--line-btn);border-radius:4px;
  color:var(--sub);cursor:pointer;user-select:none;
}
.lang-chip.on{border-color:var(--ink);color:var(--ink);background:#F4F4EE;}

/* ---- 本页：页内弹窗（二次确认，沿用全站组件样式） ---- */
.vs-overlay{position:absolute;inset:0;background:transparent;display:none;align-items:center;justify-content:center;z-index:50;}
.vs-overlay.show{display:flex;}
.vs-modal{width:480px;background:var(--card);border:1px solid var(--ink);border-radius:6px;overflow:hidden;padding:26px 28px 28px;}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px;}
.modal-tag{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:2px;color:var(--orange);}
.vs-modal-close{background:none;border:none;font-size:18px;color:var(--aux);cursor:pointer;line-height:1;padding:2px;}
.modal-title{font-size:20px;font-weight:700;}
.modal-divider{border:none;border-top:1px solid var(--line);margin:16px 0 20px;}
.modal-desc{font-size:16px;color:var(--ink);line-height:1.7;}
.md-foot{display:flex;justify-content:center;gap:14px;margin-top:26px;}
.md-btn{height:52px;padding:0 28px;border-radius:4px;font-size:16px;font-weight:600;font-family:var(--sans);cursor:pointer;border:1px solid transparent;}
.md-btn-line{background:var(--card);border-color:var(--line-btn);color:var(--ink);}
.md-btn-dark{background:var(--dark);border-color:var(--dark);color:#FFFFFF;}
</style>
</head>
<body>
<div class="vs-canvas">

  <header class="vs-header">
    <div class="logo">VendSolution</div>
    <div class="h-item"><span class="lbl">设备ID</span><span class="mono">SYD0254</span></div>
    <div class="h-item"><span class="lbl">时间</span><span class="mono">15:55</span></div>
    <div class="h-item right user-entry" data-menu="#user-menu"><span class="lbl">用户</span><b>Adams</b><span class="user-caret">&#9662;</span></div>
    <div class="vs-menu" id="user-menu">
      <div class="vs-menu-lang">
        <span class="vs-menu-lang-label">切换语言</span>
        <span class="lang-chip on" data-act="set-lang" data-lang="zh">中文</span>
        <span class="lang-chip" data-act="set-lang" data-lang="en">English</span>
      </div>
      <button class="vs-menu-item" data-modal="#logout-confirm">退出登录</button>
      <button class="vs-menu-item" data-modal="#resell-confirm">返回售卖页面</button>
    </div>
  </header>

  <main class="vs-main">

    <!-- 设备状态区域 -->
    <section class="vs-status-row">
      <div class="vs-status-left">
        <div class="vs-status-title">
          <span class="vs-lamp"></span>
          设备正常运行
        </div>
        <div class="vs-status-net">
          <span class="vs-net-label">网络</span>
          <span class="vs-net-dots">
            <span class="vs-net-dot"></span>
            <span class="vs-net-dot"></span>
            <span class="vs-net-dot"></span>
            <span class="vs-net-dot"></span>
            <span class="vs-net-dot off"></span>
          </span>
          <span>最后同步：<span class="mono">08/01 13:59</span></span>
        </div>
        <hr class="vs-divider">
        <div class="vs-cups-row">
          <span class="vs-cups-label">今日销量：</span>
          <span class="vs-cups-num">55</span>
        </div>
      </div>

      <div class="vs-status-alerts">
        <div class="vs-alerts-head" data-href="54-alerts.html">
          <span class="vs-alerts-title">告警</span>
          <span class="vs-alerts-badge">3</span>
        </div>
        <div class="vs-alert-item" data-href="54-alerts.html?tab=ops">
          <span class="vs-alert-time">12:10</span>
          <span class="vs-alert-text">纸杯余量不足（18%）</span>
          <span class="vs-alert-arrow">&#8250;</span>
        </div>
        <div class="vs-alert-item" data-href="54-alerts.html?tab=ops">
          <span class="vs-alert-time">09:42</span>
          <span class="vs-alert-text">右搅拌器清洗提醒</span>
          <span class="vs-alert-arrow">&#8250;</span>
        </div>
        <div class="vs-alert-item" data-href="54-alerts.html?tab=device">
          <span class="vs-alert-time">07-30 22:58</span>
          <span class="vs-alert-text">离线</span>
          <span class="vs-alert-arrow">&#8250;</span>
        </div>
      </div>
    </section>

    <!-- 快捷操作 -->
    <section>
      <div class="vs-section-title">快捷操作</div>
      <div class="vs-quick-grid">
        <a class="vs-quick-btn vs-q-restock" href="13-vm-ops-overview.html">
          <span class="vs-quick-title">补货</span>
          <span class="vs-quick-sub">上次补货：<span class="mono">08/01 11:02</span></span>
        </a>
        <a class="vs-quick-btn vs-q-stats" href="45-products-sort-1.html">
          <span class="vs-quick-title">商品排序</span>
        </a>
        <a class="vs-quick-btn vs-q-goods" href="42-products-price-1.html">
          <span class="vs-quick-title">商品价格</span>
        </a>
        <a class="vs-quick-btn vs-q-clean" href="46-products-sort-2.html">
          <span class="vs-quick-title">商品分组管理</span>
        </a>
        <button class="vs-quick-btn vs-q-ops" data-href="32-eng-unit-test.html">
          <span class="vs-quick-title">测试出货</span>
        </button>
      </div>
    </section>

    <!-- 更多功能 -->
    <section class="vs-more-section">
      <div class="vs-section-title sm">更多功能</div>
      <div class="vs-more-grid">
        <button class="vs-more-btn" data-href="../demo/02-settings-device.html">基本设置</button>
        <button class="vs-more-btn" data-href="../demo/03-settings-users.html">账号设置</button>
        <a class="vs-more-btn" href="36-products.html">商品管理</a>
        <button class="vs-more-btn" data-href="54-alerts.html">告警</button>
        <button class="vs-more-btn" data-href="53-stats.html">统计</button>
        <button class="vs-more-btn">预留4</button>
        <button class="vs-more-btn">预留5</button>
      </div>
    </section>

  </main>

  <!-- 二次确认：退出登录 -->
  <div class="vs-overlay" id="logout-confirm">
    <div class="vs-modal">
      <div class="modal-head">
        <div>
          <div class="modal-tag">CONFIRM</div>
          <div class="modal-title" style="margin-top:6px">退出登录</div>
        </div>
        <button class="vs-modal-close" data-close-hide>&#10005;</button>
      </div>
      <hr class="modal-divider">
      <div class="modal-desc">确定要退出登录吗？<br>退出后将返回账号密码登录页面。</div>
      <div class="md-foot">
        <button class="md-btn md-btn-line" data-close-hide>取消</button>
        <button class="md-btn md-btn-dark" data-href="../demo/04-login.html">确定退出</button>
      </div>
    </div>
  </div>

  <!-- 二次确认：返回售卖页面 -->
  <div class="vs-overlay" id="resell-confirm">
    <div class="vs-modal">
      <div class="modal-head">
        <div>
          <div class="modal-tag">CONFIRM</div>
          <div class="modal-title" style="margin-top:6px">返回售卖页面</div>
        </div>
        <button class="vs-modal-close" data-close-hide>&#10005;</button>
      </div>
      <hr class="modal-divider">
      <div class="modal-desc">确定要返回售卖页面吗？<br>确认后将退出运营后台，本演示环境返回账号密码登录页面。</div>
      <div class="md-foot">
        <button class="md-btn md-btn-line" data-close-hide>取消</button>
        <button class="md-btn md-btn-dark" data-href="../demo/04-login.html">确定返回</button>
      </div>
    </div>
  </div>
</div>
<script src="../shared/i18n.js" defer></script>
<script src="../shared/interactions.js" defer></script>
</body>
</html>
