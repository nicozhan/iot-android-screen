<style>
  .cl-status-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .cl-card{
    background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:24px 28px;display:flex;flex-direction:column;gap:12px;
  }
  .cl-card-label{font-size:15px;color:var(--sub);font-weight:500;}
  .cl-card-value{font-size:32px;font-weight:700;font-family:var(--mono);letter-spacing:-.5px;}
  .cl-card-sub{font-size:14px;color:var(--aux);}
  .cl-card-sub .mono{color:var(--ink);font-weight:600;}

  .cl-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .cl-section-head .vs-section-title{margin-bottom:0;}
  .cl-link{font-size:15px;color:var(--blue);font-weight:600;cursor:pointer;text-decoration:none;}

  .cl-strategy-card{
    background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:24px 28px;display:flex;align-items:center;gap:64px;
  }
  .cl-strategy-cur{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:700;}
  .cl-dot-on{width:14px;height:14px;border-radius:50%;background:var(--green);flex:0 0 14px;}
  .cl-strategy-item{font-size:15px;color:var(--sub);}
  .cl-strategy-item b{color:var(--ink);font-weight:600;margin-left:6px;}
  .cl-strategy-item .mono{font-weight:600;}

  .cl-actions{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .cl-action-btn{
    height:120px;background:var(--card);border:1px solid var(--line);border-radius:6px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 36px;text-align:left;
    font-family:var(--sans);cursor:pointer;position:relative;overflow:hidden;
  }
  .cl-action-btn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--dark);border-radius:6px 0 0 6px;}
  .cl-action-btn:hover{background:#FCFCFA;}
  .cl-action-btn:active{background:#F2F2EE;}
  .cl-action-btn .arrow{color:var(--aux);font-size:24px;}
  .cl-btn-name{font-size:26px;font-weight:700;color:var(--ink);}
  .cl-btn-sub{font-size:15px;color:var(--sub);margin-top:8px;}


  /* ---- 浮层内容样式（自弹窗页合并） ---- */
  
  .vs-m-label{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:14px;}
  
  .cl-radio-row{display:flex;flex-direction:column;gap:18px;}
  
  .cl-btn{flex:1;height:56px;border-radius:4px;font-size:17px;font-weight:600;font-family:var(--sans);cursor:pointer;}
  
  .cl-btn-line{background:var(--card);border:1px solid var(--line-btn);color:var(--ink);}
  
  .cl-btn-dark{background:var(--dark);border:1px solid var(--dark);color:#FFF;}
  
  .cl-radio-inline{display:flex;gap:48px;}
  
  .cl-input{height:56px;border:1px solid var(--line-btn);border-radius:4px;display:flex;align-items:center;padding:0 18px;font-size:18px;font-family:var(--mono);font-weight:600;background:var(--card);}
  
  .cl-input .unit{font-family:var(--sans);font-weight:400;color:var(--sub);margin-left:10px;font-size:15px;}
  
  .cl-next{font-size:14px;color:var(--sub);}
  
  .cl-next .mono{color:var(--ink);font-weight:600;}
  
  .cl-check-list{display:flex;flex-direction:column;gap:14px;font-size:16px;color:var(--ink);}
  
  .cl-check-item{display:flex;gap:10px;align-items:flex-start;line-height:1.5;}
  
  .cl-check-item .bullet{color:var(--ink);font-weight:700;}
  
  .cl-step{font-size:15px;color:var(--sub);}
  
  .cl-step .mono{font-weight:700;color:var(--ink);font-size:16px;}
  
  .cl-task{font-size:24px;font-weight:700;}
  
  .cl-progress{width:100%;height:14px;background:var(--track);border-radius:7px;overflow:hidden;}
  
  .cl-progress-bar{height:100%;width:60%;background:var(--green);border-radius:7px;}
  
  .cl-pct{font-family:var(--mono);font-size:16px;font-weight:700;}
  
  .cl-warn{font-size:14px;color:var(--orange);font-weight:600;}
  
  .cl-stop-btn{width:240px;height:56px;background:var(--card);border:1px solid var(--red);border-radius:4px;color:var(--red);font-size:17px;font-weight:600;font-family:var(--sans);cursor:pointer;}
</style>
</head>
