<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>VendSolution Console · 售卖机补货 / 运营总览</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  /* ---- 分段 Tab（补货 / 盘点） ---- */
  .seg{display:flex;width:420px;height:52px;margin:0 auto;flex:0 0 52px;
    border:1px solid var(--line-btn);border-radius:6px;overflow:hidden;background:var(--card);}
  .seg button{flex:1;border:none;background:var(--card);font-size:17px;font-weight:500;
    color:var(--sub);cursor:pointer;font-family:var(--sans);}
  .seg button+button{border-left:1px solid var(--line-btn);}
  .seg button:hover{background:#FCFCFA;}
  .seg button.active{background:var(--track);color:var(--ink);font-weight:700;}
  .seg button.active:hover{background:var(--track);}

  /* ---- 工具条 ---- */
  .vm-toolbar{display:flex;align-items:center;justify-content:space-between;flex:0 0 40px;}
  .vm-count{font-size:16px;font-weight:700;}
  .vm-tools{display:flex;gap:10px;}
  .tool-btn{height:40px;padding:0 14px;background:var(--card);border:1px solid var(--line-btn);
    border-radius:4px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;
    font-family:var(--sans);display:flex;align-items:center;gap:6px;}
  .tool-btn:hover{background:#FCFCFA;}
  .tool-btn.active{background:var(--track);border-color:var(--line);}
  .tool-btn .chev{color:var(--aux);font-size:12px;}

  /* ---- 货道卡片（4×3） ---- */
  .vm-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);
    gap:14px;flex:1;min-height:0;}
  .vm-card{background:var(--card);border:1px solid var(--line-btn);border-radius:6px;
    padding:12px 14px;display:flex;flex-direction:column;cursor:pointer;min-height:0;}
  .vm-card:hover{background:#FCFCFA;}
  .vm-lid{font-size:16px;font-weight:700;font-family:var(--mono);}
  .vm-img{flex:1;min-height:100px;background:var(--track);border-radius:4px;
    display:flex;align-items:center;justify-content:center;color:var(--aux);font-size:14px;margin:8px 0;}
  .vm-row{display:flex;align-items:baseline;justify-content:space-between;}
  .vm-name{font-size:16px;font-weight:700;}
  .vm-stock{font-size:15px;font-weight:700;font-family:var(--mono);}
  .vm-card.low .vm-stock{color:var(--red);}
  .vm-bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden;margin:8px 0 10px;}
  .vm-bar i{display:block;height:100%;background:var(--ink);border-radius:3px;}
  .vm-card.low .vm-bar i{background:var(--red);}
  .vm-foot{display:flex;align-items:center;justify-content:space-between;}
  .vm-restock{font-size:15px;font-weight:700;background:none;border:none;cursor:pointer;
    color:var(--ink);font-family:var(--sans);padding:0;}
  .vm-ctrl{display:flex;align-items:center;gap:6px;}
  .sq{width:32px;height:32px;border:1px solid var(--line-btn);border-radius:4px;background:var(--card);
    font-size:16px;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .sq:hover{background:#FCFCFA;}
  .plus-n{min-width:40px;height:32px;border:1px solid var(--line-btn);border-radius:4px;background:var(--card);
    font-size:14px;font-weight:600;font-family:var(--mono);color:var(--ink);
    display:flex;align-items:center;justify-content:center;padding:0 6px;}
</style>
</head>
<body>
<div class="vs-canvas">

  <div class="vs-topbar">
    <button class="vs-btn-line">&#8592;&nbsp;返回</button>
    <div class="page-title">补货</div>
    <button class="vs-btn-line" style="margin-left:auto">保存</button>
  </div>

  <main class="vs-main" style="gap:18px">
    <div class="seg">
      <button class="active">补货</button>
      <button>盘点</button>
    </div>

    <div class="vm-toolbar">
      <span class="vm-count">共 12 个货道</span>
      <div class="vm-tools">
        <button class="tool-btn">&#8645;&nbsp;货道<span class="chev">&#9662;</span></button>
        <button class="tool-btn active">&#9638;&nbsp;图片模式</button>
        <button class="tool-btn">多选</button>
        <button class="tool-btn">全部补满</button>
        <button class="tool-btn">全部清空</button>
      </div>
    </div>

    <div class="vm-grid">
      <div class="vm-card low"><span class="vm-lid">L1</span><div class="vm-img">商品图片</div><div class="vm-row"><span class="vm-name">咖啡豆</span><span class="vm-stock">2/10</span></div><div class="vm-bar"><i style="width:20%"></i></div><div class="vm-foot"><button class="vm-restock">补货</button><div class="vm-ctrl"><button class="sq">&minus;</button><span class="plus-n">+7</span><button class="sq">+</button></div></div></div>
      <div class="vm-card"><span class="vm-lid">L2</span><div class="vm-img">商品图片</div><div class="vm-row"><span class="vm-name">奶粉</span><span class="vm-stock">4/10</span></div><div class="vm-bar"><i style="width:40%"></i></div><div class="vm-foot"><button class="vm-restock">补货</button><div class="vm-ctrl"><button class="sq">&minus;</button><span class="plus-n">+6</span><button class="sq">+</button></div></div></div>
      <div class="vm-card"><span class="vm-lid">L3</span><div class="vm-img">商品图片</div><div class="vm-row"><span class="vm-name">糖浆</span><span class="vm-stock">3/10</span></div><div class="vm-bar"><i style="width:30%"></i></div><div class="vm-foot"><button class="vm-restock">补货</button><div class="vm-ctrl"><button class="sq">&minus;</button><span class="plus-n">+7</span><button class="sq">+</button></div></div></div>
      <div class="vm-card"><span class="vm-lid">L4</span><div class="vm-img">商品图片</div><div class="vm-row"><span class="vm-name">纸杯</span><span class="vm-stock">8/10</span></div><div class="vm-bar"><i style="width:80%"></i></div><div class="vm-foot"><button class="vm-restock">补货</button><div class="vm-ctrl"><button class="sq">&minus;</button><span class="plus-n">+2</span><button class="sq">+</button></div></div></div>
      <div class="vm-card"><span class="vm-lid">L5</span><div class="vm-img">商品图片</div><div class="vm-row"><span class="vm-name">搅拌棒</span><span class="vm-stock">8/10</span></div><div class="vm-bar"><i style="width:80%"></i></div><div class="vm-foot"><button class="vm-restock">补货</button><div class="vm-ctrl"><button class="sq">&minus;</button><span class="plus-n">+2</span><button class="sq">+</button></div></div></div>
      <div class="vm-card"><span class="vm-lid">L6</span><div class="vm-img">商品图片</div><div class="vm-row"><span class="vm-name">巧克力粉</span><span class="vm-stock">3/10</span></div><div class="vm-bar"><i style="width:30%"></i></div><div class="vm-foot"><button class="vm-restock">补货</button><div class="vm-ctrl"><button class="sq">&minus;</button><span class="plus-n">+7</span><button class="sq">+</button></div></div></div>
      <div class="vm-card"><span class="vm-lid">L7</span><div class="vm-img">商品图片</div><div class="vm-row"><span class="vm-name">杯盖</span><span class="vm-stock">6/10</span></div><div class="vm-bar"><i style="width:60%"></i></div><div class="vm-foot"><button class="vm-restock">补货</button><div class="vm-ctrl"><button class="sq">&minus;</button><span class="plus-n">+4</span><button class="sq">+</button></div></div></div>
      <div class="vm-card low"><span class="vm-lid">L8</span><div class="vm-img">商品图片</div><div class="vm-row"><span class="vm-name">可可粉</span><span class="vm-stock">2/10</span></div><div class="vm-bar"><i style="width:20%"></i></div><div class="vm-foot"><button class="vm-restock">补货</button><div class="vm-ctrl"><button class="sq">&minus;</button><span class="plus-n">+8</span><button class="sq">+</button></div></div></div>
      <div class="vm-card"><span class="vm-lid">L9</span><div class="vm-img">商品图片</div><div class="vm-row"><span class="vm-name">燕麦奶</span><span class="vm-stock">4/12</span></div><div class="vm-bar"><i style="width:33%"></i></div><div class="vm-foot"><button class="vm-restock">补货</button><div class="vm-ctrl"><button class="sq">&minus;</button><span class="plus-n">+8</span><button class="sq">+</button></div></div></div>
      <div class="vm-card"><span class="vm-lid">L10</span><div class="vm-img">商品图片</div><div class="vm-row"><span class="vm-name">咖啡杯</span><span class="vm-stock">6/12</span></div><div class="vm-bar"><i style="width:50%"></i></div><div class="vm-foot"><button class="vm-restock">补货</button><div class="vm-ctrl"><button class="sq">&minus;</button><span class="plus-n">+6</span><button class="sq">+</button></div></div></div>
      <div class="vm-card low"><span class="vm-lid">L11</span><div class="vm-img">商品图片</div><div class="vm-row"><span class="vm-name">糖浆</span><span class="vm-stock">2/10</span></div><div class="vm-bar"><i style="width:20%"></i></div><div class="vm-foot"><button class="vm-restock">补货</button><div class="vm-ctrl"><button class="sq">&minus;</button><span class="plus-n">+8</span><button class="sq">+</button></div></div></div>
      <div class="vm-card"><span class="vm-lid">L12</span><div class="vm-img">商品图片</div><div class="vm-row"><span class="vm-name">奶盖</span><span class="vm-stock">9/10</span></div><div class="vm-bar"><i style="width:90%"></i></div><div class="vm-foot"><button class="vm-restock">补货</button><div class="vm-ctrl"><button class="sq">&minus;</button><span class="plus-n">+1</span><button class="sq">+</button></div></div></div>
    </div>
  </main>
</div>

</body>
</html>
