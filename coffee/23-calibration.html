<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>校准 · VendSolution</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  .cal-hero{
    background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:26px 28px;display:flex;align-items:center;justify-content:space-between;
    cursor:pointer;position:relative;overflow:hidden;
  }
  .cal-hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue);}
  .cal-hero:hover{background:#FCFCFA;}
  .cal-hero-name{font-size:22px;font-weight:700;}
  .cal-hero-meta{display:flex;align-items:center;gap:16px;font-size:15px;color:var(--sub);}
  .cal-hero-meta .mono{color:var(--ink);font-weight:600;}
  .cal-arrow{color:var(--aux);font-size:18px;}

  .cal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .cal-item{
    background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:22px 24px;display:flex;flex-direction:column;gap:12px;cursor:pointer;
  }
  .cal-item:hover{background:#FCFCFA;}
  .cal-item-head{display:flex;align-items:center;justify-content:space-between;}
  .cal-item-name{font-size:18px;font-weight:600;}
  .cal-item-last{font-size:13px;color:var(--aux);}
  .cal-item-last .mono{color:var(--sub);font-weight:500;}
</style>
</head>
