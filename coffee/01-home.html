<style>
  /* ---- 本页：顶栏用户下拉菜单 ---- */
  .vs-header{position:relative;z-index:5;}
  .user-entry{cursor:pointer;user-select:none;display:flex;align-items:center;gap:4px;}
  .user-caret{font-size:12px;color:var(--sub);margin-left:2px;line-height:1;}
  .vs-menu{
    position:absolute;top:70px;right:24px;z-index:40;
    min-width:248px;background:var(--card);
    border:1px solid var(--ink);border-radius:6px;
    box-shadow:0 14px 36px rgba(0,0,0,.18);
    display:none;overflow:hidden;
  }
  .vs-menu.show{display:block;}
  .vs-menu-item{
    display:block;width:100%;height:52px;padding:0 20px;
    background:none;border:none;text-align:left;
    font-size:16px;font-weight:500;color:var(--ink);
    font-family:var(--sans);cursor:pointer;
  }
  .vs-menu-item:hover{background:#F4F4EE;}
  .vs-menu-item + .vs-menu-item{border-top:1px solid var(--line);}

  /* ---- 语言选择：纵向左对齐列表，预留 5 个语言位（后续语言只往下加行，不动版式） ---- */
  .vs-menu-lang{padding:14px 0 8px;border-bottom:1px solid var(--line);}
  .vs-menu-lang-label{display:block;padding:0 20px 8px;
    font-size:12px;font-weight:600;letter-spacing:1px;color:var(--aux);}
  .lang-list{display:flex;flex-direction:column;}
  .lang-opt{display:flex;align-items:center;height:44px;padding:0 20px;
    font-size:16px;color:var(--ink);cursor:pointer;user-select:none;}
  .lang-opt:hover{background:#F4F4EE;}
  .lang-opt .lang-name{flex:1;text-align:left;}
  .lang-opt .lang-check{font-size:15px;font-weight:700;color:var(--ink);opacity:0;}
  .lang-opt.on{background:#F4F4EE;font-weight:700;}
  .lang-opt.on .lang-check{opacity:1;}
  .lang-opt.soon{color:var(--aux);cursor:default;}
  .lang-opt.soon:hover{background:none;}
  .lang-opt .lang-tag{font-size:12px;color:var(--aux);border:1px solid var(--line-btn);
    border-radius:3px;padding:1px 6px;}

  /* ---- 快捷操作：4 列 × 2 行（当前 6 项 → 首行 4 个、次行 2 个，余位留空） ---- */
  .vs-quick-grid{grid-template-columns:repeat(4,1fr);}
  /* 出货测试：石板灰，与清洗/价格/补货/排序四色区分 */
  .vs-q-test{--accent:#58606B;--accent-hover:#4A515A;--accent-active:#3D434B;}
  /* 校准：紫，与其余五项区分 */
  .vs-q-cal{--accent:#6A5A9E;--accent-hover:#5B4C8A;--accent-active:#4D4076;}
  /* ---- 更多功能：每行最多 6 个（7 项 → 首行 6、次行 1，余位留空） ---- */
  .vs-more-grid{grid-template-columns:repeat(6,1fr);}

  /* ---- 顶栏：文案均匀分布（品牌 / 设备ID / 时间 / 用户 等间距铺满整条） ---- */
  .vs-header{justify-content:space-between;}
  .vs-header .h-spacer{display:none;}

  /* ---- 本页：二次确认浮层组件 ---- */
  .modal-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px;}
  .modal-tag{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:2px;color:var(--orange);}
  .modal-title{font-size:20px;font-weight:700;}
  .modal-divider{border:none;border-top:1px solid var(--line);margin:16px 0 20px;}
  .modal-desc{font-size:16px;line-height:1.7;color:var(--sub);}
</style>
</head>
