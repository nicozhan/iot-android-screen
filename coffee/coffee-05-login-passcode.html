<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>VendSolution Console · 运维模式登录 / 口令</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  .login-topbar{justify-content:space-between;}
  .login-topbar .bar-title{font-size:24px;font-weight:700;}
  .login-body{flex:1;padding-top:44px;display:flex;flex-direction:column;align-items:center;}
  .login-title{font-size:24px;font-weight:700;margin-bottom:30px;}
  .login-tabs{width:64%;display:flex;border-bottom:1px solid var(--line);}
  .login-tab{
    flex:1;padding:14px 0;text-align:center;font-size:17px;font-weight:500;
    color:var(--aux);cursor:pointer;background:none;border:none;
    font-family:var(--sans);position:relative;
  }
  .login-tab.active{color:var(--ink);font-weight:700;}
  .login-tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--ink);}
  .login-form{width:64%;margin-top:34px;}
  .login-form .vs-field{max-width:none;margin-bottom:30px;}
  .login-form .vs-field-label{font-size:16px;}
  .login-form .vs-input{height:56px;}
  .login-form .vs-input .ph{color:#B3B3AE;}
  .login-submit{
    width:100%;height:64px;margin-top:20px;
    background:var(--dark);border:1px solid var(--dark);border-radius:4px;
    color:#FFFFFF;font-size:18px;font-weight:700;font-family:var(--sans);cursor:pointer;
  }
  .login-submit:hover{background:#1F1F1F;}
  .login-submit:active{background:#000000;}
</style>
</head>
<body>
<div class="vs-canvas">

  <div class="vs-topbar login-topbar">
    <span class="bar-title">运维模式</span>
    <div class="lang-switch" data-i18n-skip>
      <button class="lang-seg" data-act="set-lang" data-lang="zh">简体中文</button>
      <button class="lang-seg" data-act="set-lang" data-lang="en">English</button>
      <button class="lang-seg" data-act="set-lang" data-lang="zh-TW">繁體中文</button>
    </div>
    <button class="vs-btn-line" data-href="../select.html">返回</button>
  </div>

  <div class="login-body">
    <div class="login-title">后台运维模式登录</div>

    <div class="login-tabs">
      <button class="login-tab active">口令</button>
      <button class="login-tab" data-href="coffee-04-login.html">账号密码</button>
    </div>

    <div class="login-form">
      <div class="vs-field">
        <span class="vs-field-label">口令</span>
        <div class="vs-input" data-kb data-kb-mask data-kb-max="6" data-kb-ph="请输入数字口令">
        </div>
      </div>
      <button class="login-submit" data-href="coffee-01-home.html" data-toast="登录成功">登录</button>
    </div>
  </div>

</div>
<script src="../shared/i18n.js" defer></script>
<script src="../shared/interactions.js" defer></script>
</body>
</html>
