<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>VendSolution Console · 本机设置</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  /* ---- 本页：本机设置独立页（整页只有一张设置卡） ---- */
  .set-card{
    background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:6px 28px;
  }
  /* 设置行：名称在左，值/控件靠右 */
  .set-row{
    display:flex;align-items:center;justify-content:space-between;gap:24px;
    min-height:64px;padding:10px 0;font-size:16px;
    border-bottom:1px solid var(--line-soft);
  }
  .set-row:last-child{border-bottom:none;}
  .set-label{font-weight:700;color:var(--ink);}
  .set-value{color:var(--ink);}
  .set-value.val-mono{font-family:var(--mono);letter-spacing:.5px;}
  /* 后台运维语言：横向单选（原写法缺此类定义，会竖排） */
  .set-lang-row{display:flex;align-items:center;gap:48px;}
  /* 购物车上限：可点开的输入框（唤起屏上数字键盘） */
  .set-input{
    width:168px;height:52px;justify-content:center;
    font-family:var(--mono);font-size:18px;font-weight:600;letter-spacing:1px;
  }
  .set-input .ph{color:var(--ink);}
</style>
</head>
<body>
<div class="vs-canvas">

  <div class="vs-topbar">
    <button class="vs-btn-line" data-href="01-home.html">&#8592;&nbsp;返回首页</button>
    <div class="page-title">本机设置</div>
  </div>

  <main class="vs-main-pad">
    <div class="vs-settings-cols">

      <!-- 左：本机设置 -->
      <div class="vs-settings-main">
        <div class="set-card">

          <div class="set-row">
            <span class="set-label">点位</span>
            <span class="set-value">XX科技园 1号楼&nbsp;&nbsp;北京市海淀区 XX路</span>
          </div>

          <div class="set-row">
            <span class="set-label">客服电话</span>
            <span class="set-value val-mono">138 000 0000</span>
          </div>

          <div class="set-row">
            <span class="set-label">售卖界面语言</span>
            <span class="set-value">中文（默认）· English</span>
          </div>

          <div class="set-row">
            <span class="set-label">后台运维语言</span>
            <span class="set-lang-row">
              <span class="vs-radio on" data-act="set-lang" data-lang="zh"><span class="dot"></span>中文</span>
              <span class="vs-radio" data-act="set-lang" data-lang="en"><span class="dot"></span>English</span>
            </span>
          </div>

          <div class="set-row">
            <span class="set-label">日期</span>
            <span class="set-value val-mono">2026/08/28</span>
          </div>

          <div class="set-row">
            <span class="set-label">时间</span>
            <span class="set-value val-mono">11:35:20</span>
          </div>

          <div class="set-row">
            <span class="set-label">购物车上限</span>
            <div class="vs-input set-input" data-kb data-kb-max="2" data-kb-value="4" data-kb-ph="4"><span class="ph">4</span></div>
          </div>

        </div>
      </div>

      <!-- 右：其他设置（预留位） -->
      <aside class="vs-settings-aside">
        <div class="vs-other-card">
          <div class="vs-other-head">其他设置</div>
          <div class="vs-reserve-item">
            <span class="vs-reserve-name">预留1</span>
            <span class="vs-reserve-tag">Reserved</span>
          </div>
          <div class="vs-reserve-item">
            <span class="vs-reserve-name">预留2</span>
            <span class="vs-reserve-tag">Reserved</span>
          </div>
        </div>
      </aside>

    </div>
  </main>

  <footer class="vs-footer">
    <button class="vs-save-btn" data-toast="已保存">保存</button>
  </footer>

</div>
<script src="../shared/i18n.js" defer></script>
<script src="../shared/interactions.js" defer></script>
<script>
/* 语言单选：引擎的 set-lang 分支会提前 return（只切语言、不动选中态），此处补视图同步 */
document.addEventListener('click', function (ev) {
  var r = ev.target.closest && ev.target.closest('.set-lang-row .vs-radio');
  if (!r) return;
  var grp = r.closest('.set-lang-row');
  grp.querySelectorAll('.vs-radio').forEach(function (x) { x.classList.remove('on'); });
  r.classList.add('on');
});
</script>
</body>
</html>
