<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>研磨量校准 · VendSolution</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  .cal-warn{
    background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:22px 28px;display:flex;align-items:center;justify-content:space-between;
  }
  .cal-warn-text{font-size:17px;font-weight:600;}
  .cal-warn-text span{color:var(--orange);margin-right:10px;font-weight:700;}
  .cal-toggle{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600;}
  .cal-switch{width:56px;height:32px;border-radius:16px;background:var(--dark);position:relative;cursor:pointer;}
  .cal-switch::after{content:"";position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;background:#FFF;}

  .cal-rounds{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  .cal-round{
    background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .cal-round-label{font-size:15px;color:var(--sub);font-weight:500;}
  .cal-round-val{font-size:36px;font-weight:700;font-family:var(--mono);}
  .cal-round-val small{font-size:16px;color:var(--aux);font-weight:500;margin-left:6px;}
  .cal-input-btn{
    width:100%;height:48px;background:var(--card);border:1px solid var(--line-btn);border-radius:4px;
    font-size:15px;font-weight:600;color:var(--ink);font-family:var(--sans);cursor:pointer;
  }
  .cal-input-btn:hover{background:#FCFCFA;}

  .cal-steps{
    background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:24px 28px;font-size:15px;line-height:2.1;color:var(--ink);
  }
  .cal-steps b{font-weight:700;display:block;margin-bottom:6px;font-size:16px;}
  .cal-steps ol{margin-left:20px;}

  .cal-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;}
  .cal-cancel{height:56px;padding:0 44px;background:var(--card);border:1px solid var(--line-btn);border-radius:4px;font-size:17px;font-weight:600;font-family:var(--sans);cursor:pointer;}
  .cal-save{height:56px;padding:0 56px;background:var(--dark);border:1px solid var(--dark);border-radius:4px;color:#FFF;font-size:17px;font-weight:600;font-family:var(--sans);cursor:pointer;}
</style>
</head>
<body>
<div class="vs-canvas">

  <div class="vs-topbar">
    <button class="vs-btn-line" data-href="coffee-23-calibration.html">← 返回校准</button>
    <div class="page-title">研磨量校准</div>
  </div>

  <div class="vs-main" style="gap:22px;">

    <div class="cal-warn">
      <div class="cal-warn-text"><span>校验警告</span>请先确认渣盒已清空。</div>
      <div class="cal-toggle"><div class="cal-switch"></div>启动</div>
    </div>

    <section>
      <div class="vs-section-title" style="margin-bottom:16px;">研磨粉的重量 (g)</div>
      <div class="cal-rounds">
        <div class="cal-round">
          <div class="cal-round-label">第一次</div>
          <div class="cal-round-val" data-kb data-kb-ph="0.0"><span class="ph">0.0</span><small>g</small></div>
          <button class="cal-input-btn" data-toast="点击左侧数值用键盘输入">输入重量</button>
        </div>
        <div class="cal-round">
          <div class="cal-round-label">第二次</div>
          <div class="cal-round-val" data-kb data-kb-ph="0.0"><span class="ph">0.0</span><small>g</small></div>
          <button class="cal-input-btn" data-toast="点击左侧数值用键盘输入">输入重量</button>
        </div>
        <div class="cal-round">
          <div class="cal-round-label">第三次</div>
          <div class="cal-round-val" data-kb data-kb-ph="0.0"><span class="ph">0.0</span><small>g</small></div>
          <button class="cal-input-btn" data-toast="点击左侧数值用键盘输入">输入重量</button>
        </div>
      </div>
    </section>

    <div class="cal-steps">
      <b>校验方法</b>
      <ol>
        <li>测空渣盒。</li>
        <li>点击「启动」磨豆机工作。</li>
        <li>称量并依次输入三次研磨粉重量。</li>
        <li>系统提示完成后，点击「保存」。</li>
      </ol>
    </div>

    <div class="cal-foot">
      <button class="cal-cancel" data-toast="已取消">取消</button>
      <button class="cal-save" data-toast="已保存">保存</button>
    </div>

  </div>
</div>
<script src="../shared/i18n.js" defer></script>
<script src="../shared/interactions.js" defer></script>
</body>
</html>
