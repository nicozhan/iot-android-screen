<style>
  body{background:var(--bg);}
  .nav-wrap{max-width:1280px;margin:0 auto;padding:40px 32px 64px;}
  .nav-head{display:flex;align-items:baseline;gap:16px;margin-bottom:8px;}
  .nav-title{font-size:28px;font-weight:700;}
  .nav-ver{font-family:var(--mono);font-size:14px;color:var(--aux);}
  .nav-sub{font-size:14px;color:var(--sub);margin-bottom:28px;}
  .nav-progress{
    background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:18px 24px;display:flex;align-items:center;gap:20px;margin-bottom:32px;
  }
  .nav-progress-label{font-size:14px;color:var(--sub);white-space:nowrap;}
  .nav-progress-track{flex:1;height:10px;background:var(--track);border-radius:5px;overflow:hidden;}
  .nav-progress-bar{height:100%;background:var(--green);border-radius:5px;}
  .nav-progress-num{font-family:var(--mono);font-size:16px;font-weight:700;white-space:nowrap;}

  .nav-group{margin-bottom:28px;}
  .nav-group-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .nav-group-title{font-size:18px;font-weight:700;}
  .nav-group-count{font-family:var(--mono);font-size:13px;color:var(--aux);}
  .nav-group-tag{font-size:12px;font-weight:700;color:#fff;background:var(--orange);border-radius:4px;padding:2px 8px;white-space:nowrap;}
  .nav-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .nav-item{
    display:flex;align-items:center;gap:14px;
    background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:16px 18px;text-decoration:none;color:var(--ink);
    transition:background .12s ease;
  }
  .nav-item:hover{background:#FCFCFA;border-color:#999;}
  .nav-item.todo{opacity:.45;pointer-events:none;}
  .nav-no{
    flex:0 0 44px;font-family:var(--mono);font-size:14px;font-weight:700;color:var(--sub);
  }
  .nav-name{flex:1;font-size:15px;font-weight:500;}
  .nav-dot{flex:0 0 10px;width:10px;height:10px;border-radius:50%;background:var(--green);}
  .nav-item.todo .nav-dot{background:var(--line-btn);}
  .nav-arrow{color:var(--aux);font-size:14px;}
</style>
</head>

const root = document.getElementById("groups");
for (const g of GROUPS) {
  const done = g.items.filter(i => i[2]).length;
  const sec = document.createElement("div");
  sec.className = "nav-group";
  sec.innerHTML = `<div class="nav-group-head">
    <div class="nav-group-title">${I18N.t(g.name)}</div>
    ${g.tag ? `<div class="nav-group-tag">${I18N.t(g.tag)}</div>` : ""}
    <div class="nav-group-count">${done} / ${g.items.length}</div>
  </div>`;
  const grid = document.createElement("div");
  grid.className = "nav-grid";
  for (const [no, name, href] of g.items) {
    const a = document.createElement("a");
    a.className = "nav-item" + (href ? "" : " todo");
    if (href) a.href = g.base + href;
    a.innerHTML = `<span class="nav-no">${no}</span>
      <span class="nav-name">${I18N.t(name)}</span>
      <span class="nav-dot"></span>
      <span class="nav-arrow">${href ? "→" : "—"}</span>`;
    grid.appendChild(a);
  }
  sec.appendChild(grid);
  root.appendChild(sec);
}

(() => {
  let total = 0, done = 0;
  for (const g of GROUPS) for (const it of g.items) { total++; if (it[2]) done++; }
  document.getElementById("navProgNum").textContent = done + " / " + total;
  document.getElementById("navProgBar").style.width = (total ? Math.round(done / total * 100) : 0) + "%";
})();
