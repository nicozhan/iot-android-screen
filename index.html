<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>VendSolution · 正在进入</title>
<meta http-equiv="refresh" content="1; url=select.html">
<link rel="canonical" href="select.html">
<meta name="robots" content="noindex">
<style>
  html,body{height:100%;margin:0;}
  body{
    background:#F2F1EC;color:#8A8A83;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
  }
  .boot{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .boot-name{font-size:20px;font-weight:700;color:#3D3D38;letter-spacing:.5px;}
  .boot-tip{font-size:14px;}
  .boot-bar{width:160px;height:3px;border-radius:2px;background:#DEDDD5;overflow:hidden;}
  .boot-bar i{display:block;height:100%;width:40%;background:#3D3D38;border-radius:2px;
    animation:slide 1s ease-in-out infinite;}
  @keyframes slide{0%{transform:translateX(-100%);}100%{transform:translateX(250%);}}
  .boot a{color:#3D3D38;}
</style>
<noscript><meta http-equiv="refresh" content="1; url=select.html"></noscript>
</head>
<body>
<div class="boot">
  <div class="boot-name">VendSolution</div>
  <div class="boot-bar"><i></i></div>
  <div class="boot-tip">正在进入控制台选择…</div>
  <noscript><div class="boot-tip"><a href="select.html">手动进入 →</a></div></noscript>
</div>
<script>
  /* 站点根 = 机型选择页（select.html）：售卖机 / 咖啡机 二选一，
     选完进各自登录页。启动动画保留，2 秒内自动跳转（meta refresh 已兜底）。 */
  (function () {
    var target = 'select.html';
    setTimeout(function () {
      try { window.location.replace(target); }
      catch (e) { window.location.href = target; }
    }, 1200);
  })();
</script>
</body>
</html>
