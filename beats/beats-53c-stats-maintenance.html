<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>VendSolution Console · 维护</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  .pg-head{
    flex:0 0 88px;height:88px;background:var(--card);
    border-bottom:1px solid var(--ink);
    display:flex;align-items:center;justify-content:center;position:relative;
  }
  .pg-back{
    position:absolute;left:40px;top:18px;height:52px;padding:0 26px;
    display:inline-flex;align-items:center;gap:8px;
    background:var(--card);border:2px solid var(--ink);border-radius:8px;
    font-family:var(--sans);font-size:16px;font-weight:700;color:var(--ink);cursor:pointer;
  }
  .pg-back:hover{background:var(--ink);color:#FFFFFF;}
  .pg-title{font-size:20px;font-weight:700;}
  .sec{padding:28px 40px 32px;border-bottom:1px solid var(--ink);background:var(--card);}
  .sec-h{font-size:17px;font-weight:700;margin-bottom:16px;}
  .range-row{display:flex;gap:12px;}
  .rg-btn{
    height:44px;padding:0 22px;background:var(--card);
    border:2px solid var(--ink);border-radius:8px;
    font-family:var(--sans);font-size:16px;font-weight:700;color:var(--ink);cursor:pointer;
  }
  .rg-btn.on{background:var(--ink);color:#FFFFFF;}
  .body{flex:1;background:var(--card);display:flex;flex-direction:column;padding-top:26px;}
  .rec-title{font-size:17px;font-weight:700;margin:0 40px 14px;}
  .rec-table{margin:0 40px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;}
  .rec-row{display:grid;grid-template-columns:1.2fr 1fr 1fr;padding:14px 24px;font-size:16px;}
  .rec-row + .rec-row{border-top:1px solid var(--line);}
  .rec-row.h{background:var(--bg);font-weight:700;}
  .rec-row .mono{font-weight:500;}
  .count-wrap{text-align:center;padding:36px 40px 0;}
  .count-num{font-size:40px;font-weight:700;font-family:var(--mono);}
  .count-num .u{font-size:22px;margin-left:6px;}
</style>
</head>
<body>
<div class="vs-canvas">

  <header class="pg-head">
    <button class="pg-back" data-href="beats-53-stats.html">&#8592; 返回统计</button>
    <div class="pg-title">维护</div>
  </header>

  <section class="sec">
    <div class="sec-h">时间范围</div>
    <div class="range-row" id="rangeRow">
      <button class="rg-btn on">今日</button>
      <button class="rg-btn">本周</button>
      <button class="rg-btn">本月</button>
      <button class="rg-btn" data-op="custom-range">自定义 &#9662;</button>
    </div>
  </section>

  <div class="body">
    <div class="rec-title">维护记录</div>
    <div class="rec-table">
      <div class="rec-row h"><span>日期</span><span>操作</span><span>操作人</span></div>
      <div class="rec-row"><span class="mono">08/28 14:30</span><span>清洗</span><span>Adams</span></div>
      <div class="rec-row"><span class="mono">08/27 09:20</span><span>补货</span><span>Tom</span></div>
      <div class="rec-row"><span class="mono">08/26 16:40</span><span>清洗</span><span>Adams</span></div>
      <div class="rec-row"><span class="mono">08/25 10:15</span><span>校准</span><span>Mike</span></div>
    </div>
    <div class="rec-title" style="margin-top:34px;">维护次数</div>
    <div class="count-wrap">
      <div class="count-num"><span class="mono">4</span><span class="u">次</span></div>
    </div>
  </div>

</div>

<script>
  document.getElementById('rangeRow').addEventListener('click', function (e) {
    var b = e.target.closest('.rg-btn');
    if (!b) return;
    this.querySelectorAll('.rg-btn').forEach(function (x) { x.classList.remove('on'); });
    b.classList.add('on');
  });
</script>
<script src="../shared/i18n.js" defer></script>
<script src="../shared/interactions.js" defer></script>
</body>
</html>
