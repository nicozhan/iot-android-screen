<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>传感器状态 · VendSolution</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  .ss-table{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .ss-row{display:flex;align-items:center;height:56px;border-bottom:1px solid var(--line-soft);font-size:15px;}
  .ss-row:last-child{border-bottom:none;}
  .ss-row.head{height:52px;background:#FAFAF7;border-bottom:1px solid var(--line);font-weight:700;color:var(--sub);font-size:14px;}
  .ss-c1{flex:1.4;padding:0 24px;font-weight:500;}
  .ss-c2{flex:1;padding:0 24px;display:flex;align-items:center;gap:8px;}
  .ss-c3{flex:0 0 140px;padding:0 24px;font-family:var(--mono);color:var(--sub);font-size:14px;}
  .ss-ok{color:var(--green);font-weight:600;display:flex;align-items:center;gap:8px;}
  .ss-dot{width:10px;height:10px;border-radius:50%;background:var(--green);}
  .ss-val{font-family:var(--mono);font-weight:600;color:var(--ink);}
  .ss-foot{display:flex;justify-content:flex-end;margin-top:18px;}
  .ss-refresh{height:52px;padding:0 36px;background:var(--dark);border:1px solid var(--dark);border-radius:4px;color:#FFF;font-size:16px;font-weight:600;font-family:var(--sans);cursor:pointer;}
</style>
</head>
<body>
<div class="vs-canvas">

  <div class="vs-topbar">
    <button class="vs-btn-line" data-href="beats-31-eng-settings.html">← 返回高级IoT设置</button>
    <div class="page-title">传感器状态</div>
  </div>

  <div class="vs-main" style="gap:0;overflow-y:auto;">
    <div class="vs-section-title sm" style="margin-bottom:14px;">设备传感器</div>
    <div class="ss-table">
      <div class="ss-row head"><div class="ss-c1">传感器</div><div class="ss-c2">状态</div><div class="ss-c3">更新时间</div></div>
      <div class="ss-row"><div class="ss-c1">废渣盒开关</div><div class="ss-c2"><span class="ss-ok">正常<span class="ss-dot"></span></span></div><div class="ss-c3">14:32</div></div>
      <div class="ss-row"><div class="ss-c1">锅炉水位</div><div class="ss-c2"><span class="ss-ok">正常<span class="ss-dot"></span></span></div><div class="ss-c3">14:32</div></div>
      <div class="ss-row"><div class="ss-c1">内部水满</div><div class="ss-c2"><span class="ss-ok">正常<span class="ss-dot"></span></span></div><div class="ss-c3">14:32</div></div>
      <div class="ss-row"><div class="ss-c1">冲泡位置</div><div class="ss-c2"><span class="ss-ok">正常<span class="ss-dot"></span></span></div><div class="ss-c3">14:32</div></div>
      <div class="ss-row"><div class="ss-c1">废盘废水</div><div class="ss-c2"><span class="ss-ok">正常<span class="ss-dot"></span></span></div><div class="ss-c3">14:32</div></div>
      <div class="ss-row"><div class="ss-c1">杯子传感器</div><div class="ss-c2"><span class="ss-ok">正常<span class="ss-dot"></span></span></div><div class="ss-c3">14:32</div></div>
      <div class="ss-row"><div class="ss-c1">储水式锅炉流量计</div><div class="ss-c2"><span class="ss-ok">正常<span class="ss-dot"></span></span></div><div class="ss-c3">14:32</div></div>
      <div class="ss-row"><div class="ss-c1">废渣盒满</div><div class="ss-c2"><span class="ss-ok">正常<span class="ss-dot"></span></span></div><div class="ss-c3">14:32</div></div>
      <div class="ss-row"><div class="ss-c1">储水式锅炉温度</div><div class="ss-c2"><span class="ss-val">92 ℃</span></div><div class="ss-c3">14:32</div></div>
      <div class="ss-row"><div class="ss-c1">废水盒满</div><div class="ss-c2"><span class="ss-ok">正常<span class="ss-dot"></span></span></div><div class="ss-c3">14:32</div></div>
      <div class="ss-row"><div class="ss-c1">即热式锅炉温度</div><div class="ss-c2"><span class="ss-val">91 ℃</span></div><div class="ss-c3">14:32</div></div>
      <div class="ss-row"><div class="ss-c1">设备状态</div><div class="ss-c2"><span class="ss-ok">正常<span class="ss-dot"></span></span></div><div class="ss-c3">14:32</div></div>
    </div>
    <div class="ss-foot">
      <button class="ss-refresh" data-toast="已刷新传感器状态">刷新状态</button>
    </div>
  </div>
</div>
<script src="../shared/i18n.js" defer></script>
<script src="../shared/interactions.js" defer></script>
</body>
</html>
