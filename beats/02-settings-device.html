<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>VendSolution Console · 设置 / 本机设置</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  /* ---- 本页：分级设置左右分栏（版式同 09-device-info.html） ---- */
  .info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:32px;
    align-items:start;
  }
  .info-card{
    background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:24px 28px;
  }
  /* 设置行：名称在左，状态值靠右 */
  .set-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;font-size:16px;}
  .set-label{font-weight:700;}
  .set-value{color:var(--ink);}
  .set-value.val-mono{font-family:var(--mono);letter-spacing:.5px;}
  /* 右侧「更多设置」标题旁的预留说明 */
  .adv-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;}
  .set-note{color:var(--aux);font-size:14px;font-weight:600;}
  /* ---- 本页：语言单选（中文 / English） ---- */
  .vs-lang-row{display:flex;align-items:center;gap:48px;}
</style>
</head>
<body>
<div class="vs-canvas">

  <div class="vs-topbar">
    <button class="vs-btn-line" data-href="01-beats-home.html">&#8592;&nbsp;返回首页</button>
    <div class="page-title">设置</div>
  </div>

  <div class="vs-tabs">
    <button class="vs-tab active">本机设置</button>
    <button class="vs-tab" data-href="09-device-info.html">设备信息</button>
    <button class="vs-tab" data-href="03-settings-users.html">应用权限</button>
  </div>

  <main class="vs-main-pad">
    <div class="info-grid">

      <!-- 左：本机设置 -->
      <section>
        <div class="vs-sub-title" style="margin-top:0">本机设置</div>
        <div class="info-card">
          <div class="set-row">
            <span class="set-label">后台运维语言</span>
            <span class="vs-lang-row">
              <span class="vs-radio on" data-act="set-lang" data-lang="zh"><span class="dot"></span>中文</span>
              <span class="vs-radio" data-act="set-lang" data-lang="en"><span class="dot"></span>English</span>
            </span>
          </div>
          <div class="set-row"><span class="set-label">日期</span><span class="set-value val-mono">2026/08/28</span></div>
          <div class="set-row"><span class="set-label">时间</span><span class="set-value val-mono">11:35:20</span></div>
        </div>

        <div class="vs-unit-head" style="margin:28px 0 16px">
          <span class="vs-unit-note">单位(本期不做)看看设备是否支持？</span>
        </div>
        <div class="vs-unit-row">
          <span class="vs-unit-name">容量</span>
          <span class="vs-radio on"><span class="dot"></span>公制<span class="unit-tag">ml</span></span>
          <span class="vs-radio"><span class="dot"></span>英制<span class="unit-tag">fl oz</span></span>
        </div>
        <div class="vs-unit-row">
          <span class="vs-unit-name">重量</span>
          <span class="vs-radio on"><span class="dot"></span>公制<span class="unit-tag">g</span></span>
          <span class="vs-radio"><span class="dot"></span>英制<span class="unit-tag">oz</span></span>
        </div>
        <div class="vs-unit-row">
          <span class="vs-unit-name">温度</span>
          <span class="vs-radio on"><span class="dot"></span>公制<span class="unit-tag">&#8451;</span></span>
          <span class="vs-radio"><span class="dot"></span>英制<span class="unit-tag">&#8457;</span></span>
        </div>
      </section>

      <!-- 右：更多设置（内容预留） -->
      <section>
        <div class="adv-head">
          <span class="vs-sub-title" style="margin:0">更多设置</span>
          <span class="set-note">（内容预留）</span>
        </div>
        <div class="info-card">
          <div class="set-row"><span class="set-label">设置1</span><span class="set-value">状态1</span></div>
          <div class="set-row"><span class="set-label">设置2</span><span class="set-value">状态2</span></div>
          <div class="set-row"><span class="set-label">设置3</span><span class="set-value">100</span></div>
          <div class="set-row"><span class="set-label">设置4</span><span class="set-value">200</span></div>
        </div>
      </section>

    </div>
  </main>

  <footer class="vs-footer">
    <button class="vs-save-btn" data-toast="已保存">保存</button>
  </footer>

</div>
<script src="../shared/i18n.js" defer></script>

<script src="../shared/interactions.js" defer></script>
</body>
</html>
