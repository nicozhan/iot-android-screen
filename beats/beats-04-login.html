<title>VendSolution Console · 运维模式登录</title>
<link rel="stylesheet" href="../shared/style.css" data-page-node-id="itlCmGYUATtibd3wX4t6wi">
<style>
  /* ---- 本页专属：居中登录布局 ---- */
  .login-topbar{
    justify-content:space-between;
  }
  .login-topbar .bar-title{font-size:24px;font-weight:700;}
  .login-body{
    flex:1;
    padding-top:44px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .login-title{
    font-size:24px;
    font-weight:700;
    margin-bottom:30px;
  }
  .login-tabs{
    width:64%;
    display:flex;
    border-bottom:1px solid var(--line);
  }
  .login-tab{
    flex:1;
    padding:14px 0;
    text-align:center;
    font-size:17px;
    font-weight:500;
    color:var(--aux);
    cursor:pointer;
    background:none;
    border:none;
    font-family:var(--sans);
    position:relative;
  }
  .login-tab.active{
    color:var(--ink);
    font-weight:700;
  }
  .login-tab.active::after{
    content:"";
    position:absolute;
    left:0;right:0;bottom:-1px;
    height:3px;
    background:var(--ink);
  }
  .login-form{
    width:64%;
    margin-top:34px;
  }
  .login-form .vs-field{max-width:none;margin-bottom:30px;}
  .login-form .vs-field-label{font-size:16px;}
  .login-form .vs-input{height:56px;}
  .login-form .vs-input .ph{color:#B3B3AE;}
  .login-submit{
    width:100%;
    height:64px;
    margin-top:20px;
    background:var(--dark);
    border:1px solid var(--dark);
    border-radius:4px;
    color:#FFFFFF;
    font-size:18px;
    font-weight:700;
    font-family:var(--sans);
    cursor:pointer;
  }
  .login-submit:hover{background:#1F1F1F;}
  .login-submit:active{background:#000000;}
</style>
</head>
