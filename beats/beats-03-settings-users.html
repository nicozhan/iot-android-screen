  /* ---- 修改口令弹窗 ---- */

    border:1px solid var(--orange);border-radius:999px;

  .pwd-role-chip:empty{display:none;}
  #pwd-modal .vs-field{max-width:none;margin-bottom:18px;}
  #pwd-modal .vs-field:last-child{margin-bottom:0;}
  #pwd-modal .vs-input .ph{color:#B3B3AE;}
  .vs-input .kb-ico{flex:0 0 auto;margin-left:10px;color:var(--aux);}
  .vs-input.err{border-color:var(--red);}
  .vs-input.err .kb-ico{color:var(--red);}
  .pwd-note{margin-top:8px;font-size:13px;color:var(--aux);line-height:1.5;}
</style>

<script>
/* 修改口令弹窗 · 页面级逻辑：角色上下文回填 + 表单校验（引擎负责键盘/浮层/提示） */
(function () {
  var modal = document.getElementById('pwd-modal');
  if (!modal) return;
  var roleChip = modal.querySelector('[data-pwd-role]');
  var fields = {
    old: modal.querySelector('[data-kb-ph="请输入原口令"]'),
    neu: modal.querySelector('[data-kb-ph="请输入新口令"]'),
    cfm: modal.querySelector('[data-kb-ph="请再次输入新口令"]')
  };
  function T(x) { return window.I18N ? window.I18N.t(x) : x; }
  function val(inp) { return inp.getAttribute('data-kb-value') || ''; }
  function resetField(inp) {
    inp.removeAttribute('data-kb-value');
    var ph = inp.querySelector('.ph');
    if (ph) ph.textContent = T(inp.getAttribute('data-kb-ph') || '');
    inp.classList.remove('err');
  }
  function resetAll() {
    Object.keys(fields).forEach(function (k) { resetField(fields[k]); });
  }
  function fail(inp, msg) {
    if (window.VS) window.VS.toast(T(msg));
    inp.click();                       // 重新唤起键盘，聚焦到出错的输入框
    inp.classList.add('err');          // click 会触发清错，故最后再加
  }
  /* 点某行「修改口令」→ 标题徽标回填角色名，并清空上次填写 */
  document.querySelectorAll('.role-pwd-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var row = btn.closest('.role-row');
      var nameEl = row && row.querySelector('.role-col-name');
      if (roleChip) roleChip.textContent = nameEl ? nameEl.textContent.trim() : '';
      resetAll();
    });
  });
  /* 手动点输入框即清除该框错误态 */
  Object.keys(fields).forEach(function (k) {
    fields[k].addEventListener('click', function () { fields[k].classList.remove('err'); });
  });
  /* 确认修改：校验 → 通过则关闭 + toast；失败则红框 + toast + 聚焦出错框 */
  var okBtn = document.getElementById('pwd-confirm');
  if (okBtn) okBtn.addEventListener('click', function () {
    var o = val(fields.old), n = val(fields.neu), c = val(fields.cfm);
    if (!o) return fail(fields.old, '请输入原口令');
    if (!n) return fail(fields.neu, '请输入新口令');
    if (n.length < 6) return fail(fields.neu, '新口令至少 6 位');
    if (n !== c) return fail(fields.cfm, '两次输入的新口令不一致');
    modal.classList.remove('show');
    resetAll();
    if (window.VS) window.VS.toast(T('口令已修改'));
  });
})();
</script>
