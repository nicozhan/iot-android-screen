<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>VendSolution Console · 告警</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  .pg-head{
    flex:0 0 88px;height:88px;background:var(--card);
    border-bottom:1px solid var(--ink);
    display:flex;align-items:center;justify-content:center;position:relative;
  }
  .pg-back{
    position:absolute;left:40px;top:18px;height:52px;padding:0 26px;
    display:inline-flex;align-items:center;gap:8px;
    background:var(--card);border:2px solid var(--ink);border-radius:8px;
    font-family:var(--sans);font-size:16px;font-weight:700;color:var(--ink);cursor:pointer;
  }
  .pg-back:hover{background:var(--ink);color:#FFFFFF;}
  .pg-title{font-size:20px;font-weight:700;}

  .sec{padding:24px 40px 8px;background:var(--card);}
  .pm-filter-bar{display:flex;flex-wrap:wrap;gap:10px;}

  .body{flex:1;background:var(--card);display:flex;flex-direction:column;padding-top:18px;}
  .alert-table{margin:0 40px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;}
  .alert-row{display:grid;grid-template-columns:1.3fr .8fr 1.5fr 2.6fr;padding:14px 24px;font-size:16px;align-items:start;}
  .alert-row + .alert-row{border-top:1px solid var(--line);}
  .alert-row.h{background:var(--bg);font-weight:700;}
  .alert-row .mono{font-weight:500;}
  .alert-cat{font-weight:700;}
  .alert-cat.device{color:#C0392B;}
  .alert-cat.ops{color:#1F6FB2;}
  .alert-code{font-family:var(--mono);font-size:14px;word-break:break-all;}
  .alert-desc{line-height:1.5;}
  .alert-desc .zh{font-weight:600;}
  .alert-desc .en{display:block;font-family:var(--mono);font-size:13px;color:var(--sub);margin-top:3px;word-break:break-word;}
  .alert-empty{padding:40px;text-align:center;color:var(--sub);font-size:16px;}

  .pager{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin:22px 40px 0;}
  .pg-btn{
    min-width:44px;height:36px;padding:0 12px;background:var(--card);
    border:2px solid var(--ink);border-radius:8px;
    font-family:var(--sans);font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;
  }
  .pg-btn:hover{background:var(--ink);color:#FFFFFF;}
  .pg-btn.off{opacity:.35;pointer-events:none;}
  .pg-info{font-family:var(--mono);font-size:15px;font-weight:500;margin:0 6px;}
</style>
</head>
<body>
<div class="vs-canvas">

  <header class="pg-head">
    <button class="pg-back" data-href="beats-01-home.html">&#8592; 返回首页</button>
    <div class="pg-title">告警</div>
  </header>

  <section class="sec">
    <div class="pm-filter-bar" id="filterBar">
      <button class="pm-chip on" data-tab="all">全部</button>
      <button class="pm-chip" data-tab="device">设备类</button>
      <button class="pm-chip" data-tab="ops">运营类</button>
    </div>
  </section>

  <div class="body">
    <div class="alert-table">
      <div class="alert-row h">
        <span>时间</span>
        <span>类型</span>
        <span>告警代码</span>
        <span>说明</span>
      </div>
      <div id="alertRows"></div>
    </div>

    <div class="pager">
      <button class="pg-btn" id="prevBtn" title="上一页">&lt;</button>
      <span class="pg-info" id="pageInfo">1 / 1</span>
      <button class="pg-btn" id="nextBtn" title="下一页">&gt;</button>
    </div>
  </div>

</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  /* 告警数据：cat = device(设备类) / ops(运营类)；说明列中英双语 */
  var ALERTS = [
    ['2026/10/01 23:23','device','Error_temp_over20','Temperature is over 20 °C','温度超过 20℃'],
    ['2026/10/01 22:58','device','Offline_now','Device is offline','设备已离线'],
    ['2026/09/30 18:40','device','Motor_stir_fault','Stirrer motor fault detected','搅拌电机故障'],
    ['2026/09/30 14:12','device','Error_cup_jam','Cup dispenser jammed','出杯机卡杯'],
    ['2026/09/29 09:05','device','Sensor_water_err','Water level sensor error','水位传感器异常'],
    ['2026/09/28 21:33','device','Error_temp_under10','Temperature below 10 °C','温度低于 10℃'],
    ['2026/09/28 11:20','device','Motor_grind_fault','Grinder motor fault','研磨电机故障'],
    ['2026/09/27 16:48','device','Comms_lost','Communication lost with controller','与控制器通讯中断'],
    ['2026/09/27 08:15','device','Error_door_open','Front door opened during operation','运行中前门被打开'],
    ['2026/09/26 19:02','device','Heater_fault','Heating element fault','加热元件故障'],
    ['2026/09/26 13:27','device','Error_power_drop','Input voltage drop detected','输入电压跌落'],
    ['2026/09/25 22:41','device','Fan_fault','Cooling fan fault','散热风扇故障'],
    ['2026/10/01 12:10','ops','Slot1_1_low','Slot1-1 stock is less than alert 20% (5/20)','Slot1-1 库存低于预警 20%（5/20）'],
    ['2026/10/01 09:42','ops','Clean_remind_r','Right stirrer cleaning reminder','右搅拌器清洗提醒'],
    ['2026/09/30 17:55','ops','Slot_L11_low','Lane L11 stock low (18%)','L11 纸巾库存不足（18%）'],
    ['2026/09/30 10:20','ops','Clean_remind_l','Left stirrer cleaning reminder','左搅拌器清洗提醒'],
    ['2026/09/29 15:33','ops','Slot_L01_low','Lane L1 stock low (20%)','L1 矿泉水库存不足（20%）'],
    ['2026/09/29 08:48','ops','Milk_low','Milk stock low (12%)','牛奶库存不足（12%）'],
    ['2026/09/28 19:10','ops','Slot_L08_low','Lane L8 stock low (20%)','L8 薯片库存不足（20%）'],
    ['2026/09/28 11:02','ops','Scheduled_maint','Scheduled maintenance due','计划性维护到期'],
    ['2026/09/27 14:25','ops','Sales_target_low','Daily sales below target','当日销量低于目标'],
    ['2026/09/27 09:30','ops','Restock_due','Restock overdue','补货已逾期'],
    ['2026/09/26 16:40','ops','Cashbox_full','Cash box nearly full','钱箱即将装满'],
    ['2026/09/26 10:15','ops','Promo_expire','Promotion period expiring','促销活动即将到期']
  ];

  var PER = 10, page = 1, tab = 'all';
  var box = document.getElementById('alertRows');
  var info = document.getElementById('pageInfo');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');

  /* 从首页深链预选 tab：?tab=device | ops | all */
  var m = /[?&]tab=(device|ops|all)/.exec(location.search);
  if (m) {
    tab = m[1];
    var chips = document.querySelectorAll('#filterBar .pm-chip');
    chips.forEach(function (c) { c.classList.toggle('on', c.getAttribute('data-tab') === tab); });
  }

  function filtered() {
    return (tab === 'all') ? ALERTS : ALERTS.filter(function (r) { return r[1] === tab; });
  }

  function render() {
    var rows = filtered();
    var pages = Math.max(1, Math.ceil(rows.length / PER));
    if (page > pages) page = pages;
    box.innerHTML = '';
    if (!rows.length) {
      var e = document.createElement('div');
      e.className = 'alert-empty';
      e.textContent = '暂无告警记录';
      box.appendChild(e);
    } else {
      rows.slice((page - 1) * PER, page * PER).forEach(function (r) {
        var row = document.createElement('div');
        row.className = 'alert-row';

        var t = document.createElement('span'); t.className = 'mono'; t.textContent = r[0];

        var cat = document.createElement('span');
        cat.className = 'alert-cat ' + (r[1] === 'device' ? 'device' : 'ops');
        cat.textContent = (r[1] === 'device') ? '设备类' : '运营类';

        var code = document.createElement('span'); code.className = 'alert-code'; code.textContent = r[2];

        var desc = document.createElement('div'); desc.className = 'alert-desc';
        var zh = document.createElement('span'); zh.className = 'zh'; zh.textContent = r[4];
        var en = document.createElement('span'); en.className = 'en'; en.textContent = r[3];
        desc.appendChild(zh); desc.appendChild(en);

        row.appendChild(t); row.appendChild(cat); row.appendChild(code); row.appendChild(desc);
        box.appendChild(row);
      });
    }
    info.textContent = page + ' / ' + pages;
    prevBtn.classList.toggle('off', page <= 1);
    nextBtn.classList.toggle('off', page >= pages);
    if (window.I18N && I18N.apply) I18N.apply();
  }

  document.getElementById('filterBar').addEventListener('click', function (e) {
    var c = e.target.closest('.pm-chip');
    if (!c) return;
    this.querySelectorAll('.pm-chip').forEach(function (x) { x.classList.remove('on'); });
    c.classList.add('on');
    tab = c.getAttribute('data-tab');
    page = 1;
    render();
  });

  prevBtn.addEventListener('click', function () { if (page > 1) { page--; render(); } });
  nextBtn.addEventListener('click', function () { if (page * PER < filtered().length) { page++; render(); } });

  render();
});
</script>
<script src="../shared/i18n.js" defer></script>
<script src="../shared/interactions.js" defer></script>
</body>
</html>
