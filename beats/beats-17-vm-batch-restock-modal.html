<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>VendSolution Console · 售卖机补货 / 批处理</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  /* ---- 统一弹窗（与商品页同套） ---- */
  .vs-overlay{position:absolute;inset:0;background:transparent;display:flex;align-items:center;justify-content:center;z-index:10;}
  .vs-modal{background:var(--card);border:1px solid var(--ink);border-radius:6px;overflow:hidden;}
  .vs-modal-head{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);font-size:17px;font-weight:700;}
  .vs-modal-close{font-size:18px;color:var(--aux);cursor:pointer;background:none;border:none;line-height:1;}
  .vs-modal-body{display:block;padding:28px;}
  .md-foot{display:flex;gap:14px;padding:0 28px 28px;}
  .md-btn{flex:1;height:52px;border-radius:4px;font-size:16px;font-weight:600;font-family:var(--sans);cursor:pointer;border:1px solid transparent;}
  .md-btn-line{background:var(--card);border-color:var(--line-btn);color:var(--ink);}
  .md-btn-green{background:var(--card);border-color:var(--green);color:var(--green);}
  .md-btn-orange{background:var(--card);border-color:var(--orange);color:var(--orange);}
  .md-btn-pink{background:var(--card);border-color:#EE3372;color:#EE3372;}
  .md-btn-dark{background:var(--dark);border-color:var(--dark);color:#FFF;}

  /* ---- 批处理内容（页内专用） ---- */
  .f-label{font-size:17px;font-weight:700;color:var(--ink);margin-top:30px;}
  .f-lanes{margin-top:12px;font-size:25px;font-weight:700;color:var(--ink);line-height:1.55;word-break:break-all;}
  .stepper{margin-top:12px;border:1px solid var(--line-btn);border-radius:6px;height:72px;display:flex;align-items:center;padding:0 14px;}
  .step-btn{width:64px;height:48px;border:1px solid var(--line-btn);border-radius:4px;background:var(--card);font-size:22px;color:var(--ink);cursor:pointer;font-family:var(--mono);}
  .step-btn:hover{background:#FCFCFA;}
  .step-val{flex:1;text-align:center;font-size:30px;font-weight:700;font-family:var(--mono);}
  .f-total{margin-top:28px;font-size:19px;font-weight:700;color:var(--ink);}
</style>
</head>
<body>
<div class="vs-canvas">

  <div class="vs-topbar">
    <a class="vs-btn-line" href="beats-13-vm-ops-overview.html">&#8592;&nbsp;返回导航</a>
    <div class="page-title">批处理</div>
  </div>

  <div class="vs-overlay">
    <div class="vs-modal" style="width:750px;">
      <div class="vs-modal-head">批处理<span class="vs-modal-close" data-close-go="beats-13-vm-ops-overview.html">&#10005;</span></div>
      <div class="vs-modal-body">
        <div class="f-label">选择的货道</div>
        <div class="f-lanes">L1-10; L2-10; L3-10 &nbsp;; L1-10; L2-10; L3-10</div>

        <div class="f-label">补货量</div>
        <div class="stepper">
          <button class="step-btn" aria-label="减少" data-step="-">&minus;</button>
          <div class="step-val" data-href="beats-15c-vm-ops-restock-numpad.html">11</div>
          <button class="step-btn" aria-label="增加" data-step="+">+</button>
        </div>

        <div class="f-total">总计补货数量： 66</div>
      </div>
      <div class="md-foot">
        <button class="md-btn md-btn-line" data-close-go="beats-13-vm-ops-overview.html">取消</button>
        <button class="md-btn md-btn-pink" data-href="beats-22-vm-confirm-remove.html">下架</button>
        <button class="md-btn md-btn-orange" data-href="beats-21-vm-confirm-clear.html">清空</button>
        <button class="md-btn md-btn-green" data-href="beats-20-vm-confirm-fill.html">补满</button>
        <button class="md-btn md-btn-dark" data-act="goto-toast" data-href="beats-13-vm-ops-overview.html" data-toast="批量补货成功">确认补货</button>
      </div>
    </div>
  </div>
</div>
<script src="../shared/i18n.js" defer></script>
<script src="../shared/interactions.js" defer></script>
</body>
</html>
