<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>VendSolution Console · 设置 / 本机设置</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  /* ---- 本页：单列设置卡 ---- */
  .info-grid{
    display:block;
    max-width:640px;
  }
  .info-card{
    background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:24px 28px;
  }
  /* 设置行：名称在左，状态值靠右 */
  .set-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;font-size:16px;}
  .set-label{font-weight:700;}
  .set-value{color:var(--ink);}
  .set-value.val-mono{font-family:var(--mono);letter-spacing:.5px;}
  /* ---- 本页：语言单选（中文 / English） ---- */
  .vs-lang-row{display:flex;align-items:center;gap:48px;}
</style>
</head>
<body>
<div class="vs-canvas">

  <div class="vs-topbar">
    <button class="vs-btn-line" data-href="beats-01-home.html">&#8592;&nbsp;返回首页</button>
    <div class="page-title">设置</div>
  </div>

  <div class="vs-tabs">
    <button class="vs-tab active">本机设置</button>
    <button class="vs-tab" data-href="beats-09-device-info.html">设备信息</button>
    <button class="vs-tab" data-href="beats-03-settings-users.html">人员设置</button>
  </div>

  <main class="vs-main-pad">
    <div class="info-grid">

      <!-- 本机设置 -->
      <section>
        <div class="vs-sub-title" style="margin-top:0">本机设置</div>
        <div class="info-card">
          <div class="set-row">
            <span class="set-label">后台运维语言</span>
            <span class="vs-lang-row">
              <span class="vs-radio on" data-act="set-lang" data-lang="zh"><span class="dot"></span>中文</span>
              <span class="vs-radio" data-act="set-lang" data-lang="en"><span class="dot"></span>English</span>
            </span>
          </div>
          <div class="set-row"><span class="set-label">日期</span><span class="set-value val-mono">2026/08/28</span></div>
          <div class="set-row"><span class="set-label">时间</span><span class="set-value val-mono">11:35:20</span></div>
        </div>
      </section>

    </div>
  </main>

  <footer class="vs-footer">
    <button class="vs-save-btn" data-toast="已保存">保存</button>
  </footer>

</div>
<script src="../shared/i18n.js" defer></script>

<script src="../shared/interactions.js" defer></script>
</body>
</html>
