<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>VendSolution · 标签管理</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  /* ===== 本页：左侧标签导航 + 右侧 SKU 标签管理（左右 4:6 双栏，版式同 46） ===== */
  .tag-main{flex:1;display:flex;flex-direction:row;flex-wrap:nowrap;min-height:0;overflow:hidden;padding:0;gap:0;}

  /* ---- 左侧标签导航栏（约 40%） ---- */
  .tag-nav{
    flex:0 0 40%;max-width:40%;min-width:0;background:var(--card);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;
  }
  .tag-nav-head{
    flex:0 0 64px;display:flex;align-items:center;justify-content:space-between;
    padding:0 20px;border-bottom:1px solid var(--line);
  }
  .tag-nav-title{font-size:19px;font-weight:700;}
  .tag-nav-toggle{
    width:36px;height:36px;border:1px solid var(--line-btn);border-radius:4px;
    background:var(--card);color:var(--sub);font-size:15px;line-height:1;
    cursor:pointer;font-family:var(--sans);
  }
  .tag-nav-toggle:hover{background:#FCFCFA;color:var(--ink);}
  .tag-nav-list{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:4px;}
  .tag-nav-item{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    height:50px;padding:0 16px;border:none;border-radius:6px;background:none;
    font-family:var(--sans);font-size:16px;color:var(--ink);cursor:pointer;text-align:left;
  }
  .tag-nav-item:hover{background:#F4F4EF;}
  .tag-nav-item.on{background:var(--track);font-weight:700;}
  .tag-nav-count{font-family:var(--mono);font-size:14px;color:var(--sub);flex:0 0 auto;}
  .tag-nav-item.on .tag-nav-count{color:var(--ink);}
  .tag-nav-new{
    margin:8px 16px 18px;height:50px;border:1px dashed var(--line-btn);border-radius:6px;
    background:none;color:var(--sub);font-family:var(--sans);font-size:15px;font-weight:600;cursor:pointer;
  }
  .tag-nav-new:hover{color:var(--ink);border-color:var(--aux);background:#FCFCFA;}
  .tag-nav.collapsed .tag-nav-list,
  .tag-nav.collapsed .tag-nav-new{display:none;}

  /* ---- 右侧 SKU 面板（约 60%，版式同 46 页） ---- */
  .sku-pane{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);}
  .sku-scroll{flex:1;overflow:auto;padding:16px 24px 8px;}
  .sku-table-head{
    display:flex;align-items:center;gap:16px;height:46px;padding:0 16px;margin-bottom:8px;
    font-size:15px;font-weight:700;color:var(--sub);
  }
  .sku-check-col{flex:0 0 24px;}
  .sku-name-col{flex:0 0 300px;}
  .sku-tags-col{flex:1;}
  .sku-check-all{
    width:24px;height:24px;border:1px solid var(--line-btn);border-radius:4px;
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
    font-size:14px;color:#fff;background:var(--card);
  }
  .sku-check-all.on{background:var(--green);border-color:var(--green);}
  .sku-list{display:flex;flex-direction:column;gap:10px;}
  .sku-list .pm-sku{height:64px;padding:0 16px;border:1px solid var(--line);border-radius:6px;}
  .sku-list .pm-sku-name{flex:0 0 300px;}
  .sku-list .pm-sku-tags{flex:1;}
  .pm-tag-none{font-size:14px;color:var(--aux);}
  .sku-empty{padding:56px 0;text-align:center;color:var(--aux);font-size:16px;}

  /* ---- 右侧底部操作栏 ---- */
  .sku-foot{
    flex:0 0 78px;display:flex;align-items:center;justify-content:space-between;
    padding:0 24px;background:var(--card);border-top:1px solid var(--line);
  }
  .sku-foot-left{display:flex;align-items:center;gap:14px;}
  .sku-foot-left .sel-count{font-size:16px;font-weight:700;}
  .sku-foot-right{display:flex;align-items:center;gap:12px;}
  .skufoot-btn{min-width:132px;justify-content:center;display:inline-flex;align-items:center;}
</style>
</head>
<body>
<div class="vs-canvas">

  <div class="vs-topbar">
    <button class="vs-btn-line" data-href="36-products.html">&#8592;&nbsp;返回</button>
    <div class="page-title">标签管理</div>
    <button class="vs-btn-line" style="margin-left:auto" data-toast="已保存">保存</button>
  </div>

  <main class="vs-main tag-main">

    <!-- 左：标签导航栏 -->
    <aside class="tag-nav" id="tagNav">
      <div class="tag-nav-head">
        <span class="tag-nav-title">标签</span>
        <button class="tag-nav-toggle" id="tagNavToggle" title="收起 / 展开">&#8994;</button>
      </div>
      <div class="tag-nav-list" id="tagNavList"></div>
      <button class="tag-nav-new" data-modal="#newtag-modal">&#65291; 新建标签</button>
    </aside>

    <!-- 右：SKU 列表 + 底部操作（同 46） -->
    <section class="sku-pane">
      <div class="sku-scroll">
        <div class="sku-table-head">
          <span class="sku-check-col"><span class="sku-check-all" id="selectAll" title="全选"></span></span>
          <span class="sku-name-col">SKU 名称</span>
          <span class="sku-tags-col">标签</span>
        </div>
        <div class="sku-list" id="skuList"></div>
        <div class="sku-empty" id="skuEmpty" style="display:none">暂无匹配的 SKU</div>
      </div>

      <div class="sku-foot">
        <div class="sku-foot-left">
          <span class="sel-count" id="selCount">已选择 0 个</span>
          <button class="vs-btn-line" data-op="clear-sel">取消选择</button>
        </div>
        <div class="sku-foot-right">
          <button class="vs-btn-line skufoot-btn" id="setTagsBtn" data-modal="#tag-modal">设置标签</button>
          <button class="vs-btn-line skufoot-btn" id="removeTagsBtn" data-op="remove-tags">移出标签</button>
        </div>
      </div>
    </section>

  </main>

  <!-- 浮层 · 设置标签（批量管理 SKU 标签） -->
  <div class="vs-overlay" id="tag-modal">
    <div class="vs-modal" style="width:600px">
      <div class="vs-modal-head">
        <div class="vs-modal-title">批量管理 SKU 标签</div>
        <button class="vs-modal-close" data-close-all>&#10005;</button>
      </div>
      <div class="vs-modal-body">
        <div class="pm-note" id="tagModalNote">已选择 0 个 SKU</div>
        <div class="pm-tag-bar" id="tagModalChips"></div>
        <div class="pm-note">已有关联的标签显示为已勾选，可多选</div>
      </div>
      <div class="md-foot">
        <button class="md-btn md-btn-line" data-close-all>取消</button>
        <button class="md-btn md-btn-dark" id="tagModalConfirm">确认设置标签</button>
      </div>
    </div>
  </div>

  <!-- 浮层 · 新建标签 -->
  <div class="vs-overlay" id="newtag-modal">
    <div class="vs-modal" style="width:560px">
      <div class="vs-modal-head">
        <div class="vs-modal-title">新建标签</div>
        <button class="vs-modal-close" data-close-hide>&#10005;</button>
      </div>
      <div class="vs-modal-body">
        <div class="vs-field" style="max-width:none">
          <span class="vs-field-label">标签名称</span>
          <div class="vs-input" id="newTagInput" data-kb data-kb-type="text" data-kb-max="12" data-kb-ph="请输入标签名称">
            <span class="ph">请输入标签名称</span>
          </div>
        </div>
        <div class="pm-note">最多 12 个字符；新标签可立即用于左侧筛选与「设置标签」。</div>
      </div>
      <div class="md-foot">
        <button class="md-btn md-btn-line" data-close-hide>取消</button>
        <button class="md-btn md-btn-dark" id="newTagConfirm" data-op="new-tag">新建</button>
      </div>
    </div>
  </div>

</div>
<script src="../shared/i18n.js" defer></script>
<script src="../shared/interactions.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var T = function (s) { return window.I18N ? window.I18N.t(s) : s; };
  var VS_TOAST = function (s) { if (window.VS && window.VS.toast) window.VS.toast(s); };

  /* ---------- 数据（示意） ---------- */
  var TAGS = ['标签1', '标签2', '标签3'];          // 标签池（无标签为虚拟项）
  var NONE = '__none';                             // "无标签"筛选哨兵
  var SKUS = [
    { id: 'SKU001', name: '商品 SKU 1', tags: ['标签1'] },
    { id: 'SKU002', name: '商品 SKU 2', tags: ['标签2'] },
    { id: 'SKU003', name: '商品 SKU 3', tags: ['标签1', '标签2', '标签3'] },
    { id: 'SKU004', name: '可口可乐', tags: ['标签2'] },
    { id: 'SKU005', name: '雪碧', tags: [] },
    { id: 'SKU006', name: '美式咖啡', tags: ['标签1', '标签3'] },
    { id: 'SKU007', name: '拿铁', tags: ['标签3'] },
    { id: 'SKU008', name: '矿泉水', tags: [] },
    { id: 'SKU009', name: '橙汁', tags: ['标签2'] },
    { id: 'SKU010', name: '独立包装薯片', tags: [] },
    { id: 'SKU011', name: '全麦三明治', tags: ['标签2', '标签3'] },
    { id: 'SKU012', name: '气泡苏打水', tags: ['标签1'] }
  ];
  var selected = { 'SKU001': true };               // 默认选中第一项（与线框一致）
  var activeTag = null;                            // null = 全部

  var byId = {};
  SKUS.forEach(function (s) { byId[s.id] = s; });

  /* ---------- DOM ---------- */
  var listEl = document.getElementById('skuList');
  var emptyEl = document.getElementById('skuEmpty');
  var navEl = document.getElementById('tagNav');
  var navListEl = document.getElementById('tagNavList');
  var navToggle = document.getElementById('tagNavToggle');
  var countEl = document.getElementById('selCount');
  var selAllEl = document.getElementById('selectAll');
  var noteEl = document.getElementById('tagModalNote');
  var chipsEl = document.getElementById('tagModalChips');
  var newInput = document.getElementById('newTagInput');

  var selfRender = false;
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function tagPills(tags) {
    return tags.length
      ? tags.map(function (t) { return '<span class="pm-mini-tag">' + esc(t) + '</span>'; }).join('')
      : '<span class="pm-tag-none">' + T('无标签') + '</span>';
  }
  function countOf(key) {
    if (key === NONE) return SKUS.filter(function (s) { return !s.tags.length; }).length;
    return SKUS.filter(function (s) { return s.tags.indexOf(key) >= 0; }).length;
  }

  /* ---------- 左侧标签导航 ---------- */
  function renderSidebar() {
    var items = [{ name: T('无标签'), key: NONE, count: countOf(NONE) }];
    TAGS.forEach(function (t) { items.push({ name: t, key: t, count: countOf(t) }); });
    navListEl.innerHTML = items.map(function (it) {
      return '<button type="button" class="tag-nav-item' + (activeTag === it.key ? ' on' : '') +
        '" data-tag="' + esc(it.key) + '">' +
        '<span class="tag-nav-name">' + esc(it.name) + '</span>' +
        '<span class="tag-nav-count">' + it.count + '</span>' +
        '</button>';
    }).join('');
  }

  /* ---------- 右侧 SKU 列表 ---------- */
  function filtered() {
    if (activeTag === null) return SKUS;
    if (activeTag === NONE) return SKUS.filter(function (s) { return !s.tags.length; });
    return SKUS.filter(function (s) { return s.tags.indexOf(activeTag) >= 0; });
  }
  function renderList() {
    var rows = filtered();
    selfRender = true;
    listEl.innerHTML = rows.map(function (s) {
      var on = !!selected[s.id];
      return '<button type="button" class="pm-sku' + (on ? ' on' : '') + '" data-id="' + s.id + '">' +
        '<span class="pm-sku-check">' + (on ? '\u2713' : '') + '</span>' +
        '<span class="pm-sku-name">' + esc(s.name) + '</span>' +
        '<span class="pm-sku-tags">' + tagPills(s.tags) + '</span>' +
        '</button>';
    }).join('');
    selfRender = false;
    emptyEl.style.display = rows.length ? 'none' : 'block';
    syncFromDom();
  }
  function syncFromDom() {
    var vis = listEl.querySelectorAll('.pm-sku');
    var visOn = 0, tagsChanged = false;
    Array.prototype.forEach.call(vis, function (r) {
      var id = r.getAttribute('data-id');
      var on = r.classList.contains('on');
      if (on) { visOn++; selected[id] = true; } else { delete selected[id]; }
      var s = byId[id];
      if (s) {
        var tags = [];
        r.querySelectorAll('.pm-mini-tag').forEach(function (t) { tags.push(t.textContent.trim()); });
        if (tags.join('|') !== s.tags.join('|')) tagsChanged = true;
        s.tags = tags;
        /* 标签被清空（如「移出标签」）时补上「无标签」占位 */
        var box = r.querySelector('.pm-sku-tags');
        if (box && !tags.length && !box.querySelector('.pm-tag-none')) {
          selfRender = true;
          box.innerHTML = tagPills([]);
          selfRender = false;
        }
      }
    });
    countEl.textContent = T('已选择 %s 个').replace('%s', Object.keys(selected).length);
    selAllEl.classList.toggle('on', vis.length > 0 && visOn === vis.length);
    if (tagsChanged) renderSidebar();   // 标签数随「设置/移出标签」实时刷新
  }

  /* 引擎接管勾选 / 移出标签后，DOM 变化回流到数据与计数 */
  new MutationObserver(function () { if (!selfRender) syncFromDom(); })
    .observe(listEl, { attributes: true, childList: true, subtree: true });

  /* 可视行原地刷新标签：数据已变（设置/移出标签），只重画标签列，
     不重新过滤——刚操作完的行不从当前视野中消失 */
  function refreshVisibleTags() {
    Array.prototype.forEach.call(listEl.querySelectorAll('.pm-sku'), function (r) {
      var s = byId[r.getAttribute('data-id')];
      if (!s) return;
      var box = r.querySelector('.pm-sku-tags');
      selfRender = true;
      box.innerHTML = tagPills(s.tags);
      selfRender = false;
    });
    syncFromDom();
  }

  /* ---------- 左侧交互：筛选（单选，再点取消） ---------- */
  navListEl.addEventListener('click', function (e) {
    var item = e.target.closest('.tag-nav-item');
    if (!item) return;
    var key = item.getAttribute('data-tag');
    if (activeTag === key) activeTag = null; else activeTag = key;
    renderSidebar();
    renderList();
  });

  /* 取消选择：连同被筛选掉的选中项一起清空（引擎只清当前可视行） */
  (function () {
    var btn = document.querySelector('[data-op="clear-sel"]');
    if (!btn) return;
    btn.addEventListener('click', function () {
      Object.keys(selected).forEach(function (k) { delete selected[k]; });
    });
  })();

  /* 移出标签：接管引擎默认流程——按数据层全量处理（含被左导航筛掉的已选项），
     弹通用二次确认（vs-confirm-tags），确认后才真正移除 */
  document.addEventListener('vs-remove-tags-ask', function (e) {
    syncFromDom();                                      // 先冲刷 DOM→数据（极快连点时 observer 可能未触发）
    var ids = Object.keys(selected);
    if (!ids.length) { VS_TOAST(T('请先选择 SKU')); e.preventDefault(); return; }
    e.preventDefault();
    window.VS.confirm('vs-confirm-tags', {
      title: '移出标签',
      text: '确定将所选 %s 个 SKU 的全部标签移出吗？',
      count: ids.length,
      okText: '确认移出',
      onOk: function () {
        ids.forEach(function (id) { var s = byId[id]; if (s) s.tags = []; });
        renderSidebar();
        refreshVisibleTags();
        VS_TOAST(T('已为所选 SKU 移出标签'));
      }
    });
  });

  /* ---------- 折叠 / 展开左侧 ---------- */
  navToggle.addEventListener('click', function () {
    var collapsed = navEl.classList.toggle('collapsed');
    navToggle.innerHTML = collapsed ? '&#708;' : '&#8994;';
  });

  /* ---------- 全选 ---------- */
  selAllEl.addEventListener('click', function () {
    var all = !selAllEl.classList.contains('on');
    selAllEl.classList.toggle('on', all);
    Array.prototype.forEach.call(listEl.querySelectorAll('.pm-sku'), function (r) {
      r.classList.toggle('on', all);
      var chk = r.querySelector('.pm-sku-check');
      if (chk) chk.textContent = all ? '\u2713' : '';
    });
    syncFromDom();
  });

  /* ---------- 设置标签弹窗 ---------- */
  function renderModalChips(force) {
    if (!force && document.getElementById('tag-modal').classList.contains('show')) return; // 已打开则不重置进行中的选择
    var selTags = [];
    Object.keys(selected).forEach(function (id) {
      var s = byId[id];
      if (s) s.tags.forEach(function (t) { if (selTags.indexOf(t) < 0) selTags.push(t); });
    });
    chipsEl.innerHTML = TAGS.map(function (t) {
      return '<button type="button" class="pm-chip' + (selTags.indexOf(t) >= 0 ? ' on' : '') + '">' + esc(t) + '</button>';
    }).join('');
    noteEl.textContent = T('已选择 %s 个 SKU').replace('%s', Object.keys(selected).length);
  }
  document.getElementById('setTagsBtn').addEventListener('click', function () { syncFromDom(); renderModalChips(); });
  document.getElementById('tagModalConfirm').addEventListener('click', function () {
    syncFromDom();                                      // 先冲刷 DOM→数据，保证拿到最新勾选
    var ids = Object.keys(selected);
    if (!ids.length) { VS_TOAST(T('请先选择 SKU')); return; }   // 0 选不关浮层，提示先勾选
    var chosen = [];
    chipsEl.querySelectorAll('.pm-chip.on').forEach(function (c) { chosen.push(c.textContent.trim()); });
    /* 应用到全部已选 SKU（含被左导航筛掉、当前不在可视列表里的） */
    ids.forEach(function (id) { var s = byId[id]; if (s) s.tags = chosen.slice(); });
    renderSidebar();
    refreshVisibleTags();
    hideModal('#tag-modal');
    VS_TOAST(T('已设置标签'));
  });

  /* ---------- 新建标签 ---------- */
  function hideModal(sel) {
    var ov = document.querySelector(sel);
    if (ov) ov.classList.remove('show');
  }
  function createTag() {
    var name = (newInput.getAttribute('data-kb-value') || '').trim();
    if (!name) { VS_TOAST(T('标签名称不能为空')); return; }
    if (TAGS.indexOf(name) < 0) TAGS.push(name);
    newInput.removeAttribute('data-kb-value');
    var ph = newInput.querySelector('.ph');
    newInput.textContent = '';
    if (ph) ph.textContent = T('请输入标签名称');
    renderSidebar();
    renderModalChips();
    hideModal('#newtag-modal');
    VS_TOAST(T('已新建标签：%s').replace('%s', name));
  }
  document.getElementById('newTagConfirm').addEventListener('click', createTag);
  newInput.addEventListener('kb-done', createTag);

  /* ---------- 语言切换后重绘动态文案 ---------- */
  new MutationObserver(function () {
    renderSidebar();
    renderModalChips();
    renderList();
  }).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });

  /* ---------- 初始化 ---------- */
  renderSidebar();
  renderList();
});
</script>
</body>
</html>
