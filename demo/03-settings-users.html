<style>
  .role-table{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .role-row{display:flex;align-items:center;padding:0 28px;border-bottom:1px solid var(--line-soft);}
  .role-row:last-child{border-bottom:none;}
  .role-row.head{height:56px;background:#FAFAF7;border-bottom:1px solid var(--line);font-size:15px;font-weight:700;color:var(--sub);}
  .role-row.item{height:96px;}
  .role-col-name{flex:0 0 220px;font-size:19px;font-weight:700;}
  .role-row.head .role-col-name{font-size:15px;font-weight:700;color:var(--sub);}
  .role-col-desc{flex:1;font-size:16px;color:var(--sub);}
  .role-col-act{flex:0 0 160px;display:flex;justify-content:flex-end;}
  .role-pwd-btn{height:48px;padding:0 22px;background:var(--card);border:1px solid var(--orange);border-radius:4px;color:var(--orange);font-size:15px;font-weight:600;font-family:var(--sans);cursor:pointer;}
  .role-pwd-btn:hover{background:#FFF7F2;}
  .role-pwd-btn:active{background:#FDEEE4;}
  .role-note{margin-top:20px;font-size:14px;color:var(--aux);}


  /* ---- 浮层内容样式（自弹窗页合并） ---- */
  
  .modal-head{
    display:flex;align-items:flex-start;justify-content:space-between;
    margin-bottom:6px;
  }
  
  .modal-tag{
    font-family:var(--mono);
    font-size:12px;font-weight:700;letter-spacing:2px;
    color:var(--orange);
  }
  
  .modal-title{font-size:20px;font-weight:700;}
  
  .modal-divider{border:none;border-top:1px solid var(--line);margin:16px 0 20px;}
</style>
</head>
