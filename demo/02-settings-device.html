<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>VendSolution Console · 设置 / 本机设置</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<div class="vs-canvas">

  <div class="vs-topbar">
    <button class="vs-btn-line" data-href="01-home.html">&#8592;&nbsp;返回首页</button>
    <div class="page-title">设置</div>
  </div>

  <div class="vs-tabs">
    <button class="vs-tab active">本机设置</button>
    <button class="vs-tab" data-href="09-device-info.html">设备信息</button>
    <button class="vs-tab" data-href="03-settings-users.html">应用权限</button>
  </div>

  <main class="vs-main-pad">
    <div class="vs-section-title">本机设置</div>

    <div class="vs-field">
      <span class="vs-field-label">后台运维语言</span>
      <div class="vs-input">
        <span>简体中文</span>
        <span class="chev">&#8744;</span>
      </div>
    </div>

    <div class="vs-field">
      <span class="vs-field-label">日期</span>
      <div class="vs-input">
        <span class="val-mono">2026/08/28</span>
      </div>
    </div>

    <div class="vs-field">
      <span class="vs-field-label">时间</span>
      <div class="vs-input">
        <span class="val-mono">11:35:20</span>
      </div>
    </div>

    <div class="vs-unit-head" style="margin:28px 0 16px">
      <span class="vs-unit-note">单位(本期不做)看看设备是否支持？</span>
    </div>
    <div class="vs-unit-row">
      <span class="vs-unit-name">容量</span>
      <span class="vs-radio on"><span class="dot"></span>公制<span class="unit-tag">ml</span></span>
      <span class="vs-radio"><span class="dot"></span>英制<span class="unit-tag">fl oz</span></span>
    </div>
    <div class="vs-unit-row">
      <span class="vs-unit-name">重量</span>
      <span class="vs-radio on"><span class="dot"></span>公制<span class="unit-tag">g</span></span>
      <span class="vs-radio"><span class="dot"></span>英制<span class="unit-tag">oz</span></span>
    </div>
    <div class="vs-unit-row">
      <span class="vs-unit-name">温度</span>
      <span class="vs-radio on"><span class="dot"></span>公制<span class="unit-tag">&#8451;</span></span>
      <span class="vs-radio"><span class="dot"></span>英制<span class="unit-tag">&#8457;</span></span>
    </div>
  </main>

  <footer class="vs-footer">
    <button class="vs-save-btn" data-toast="已保存">保存</button>
  </footer>

</div>
<script src="../shared/interactions.js" defer></script>
</body>
</html>
