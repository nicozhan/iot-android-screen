<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>VendSolution Console · 设备信息 / 网络测试中</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  /* ---- 设备信息卡片 ---- */
  .info-card{
    background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:24px 28px;margin-bottom:26px;max-width:860px;
  }
  .info-row{
    display:flex;align-items:center;
    padding:9px 0;font-size:16px;
  }
  .info-label{flex:0 0 130px;font-weight:700;}
  .info-value{color:var(--ink);}
  .info-value .mono{letter-spacing:.3px;}
  .info-value .dim{color:var(--aux);}
  .net-ok{display:inline-flex;align-items:center;gap:8px;color:var(--green);font-weight:600;}
  .net-ok i{width:12px;height:12px;border-radius:50%;background:var(--green);}
  .sig-dots{display:inline-flex;gap:6px;align-items:center;}
  .sig-dots i{width:12px;height:12px;border-radius:50%;background:var(--green);}
  .sig-dots i.off{background:transparent;border:1px solid var(--line-btn);}
  .info-action{
    margin-left:auto;height:44px;padding:0 20px;
    background:var(--card);border:1px solid var(--green);border-radius:4px;
    color:var(--green);font-size:15px;font-weight:600;font-family:var(--sans);cursor:pointer;
  }
  .info-action:hover{background:#F2FAF5;}
  .adv-head{display:flex;align-items:baseline;gap:12px;margin:4px 0 14px;}
  .adv-note{color:var(--red);font-size:14px;font-weight:600;}

  /* ---- 加载弹窗 ---- */
  .vs-overlay{position:absolute;inset:0;background:transparent;
    display:flex;align-items:center;justify-content:center;z-index:10;}
  .loading-modal{
    width:360px;background:var(--card);
    border:1px solid var(--ink);border-radius:6px;
    padding:36px 32px 28px;
    display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  .spinner{
    width:44px;height:44px;border-radius:50%;
    border:4px solid var(--line-soft);
    border-top-color:var(--ink);
    animation:spin 0.9s linear infinite;
    margin-bottom:8px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-title{font-size:18px;font-weight:700;}
  .loading-sub{font-size:14px;color:var(--aux);}
  .loading-cancel{
    margin-top:18px;height:44px;padding:0 28px;
    background:var(--card);border:1px solid var(--line-btn);border-radius:4px;
    font-size:15px;font-weight:600;font-family:var(--sans);cursor:pointer;color:var(--ink);
  }
  .loading-cancel:hover{background:#FCFCFA;}
</style>
</head>
<body>
<div class="vs-canvas">

  <div class="vs-topbar">
    <button class="vs-btn-line" data-href="01-home.html">&#8592;&nbsp;返回首页</button>
    <div class="page-title">设置</div>
  </div>

  <div class="vs-tabs">
    <button class="vs-tab" data-href="02-settings-device.html">本机设置</button>
    <button class="vs-tab active">设备信息</button>
    <button class="vs-tab" data-href="03-settings-users.html">角色权限</button>
  </div>

  <main class="vs-main-pad">
    <div class="vs-sub-title" style="margin-top:0">基础信息</div>
    <div class="info-card">
      <div class="info-row"><span class="info-label">品牌</span><span class="info-value">VendSolution</span></div>
      <div class="info-row"><span class="info-label">型号</span><span class="info-value">Coffee Machine X</span></div>
      <div class="info-row"><span class="info-label">备注</span><span class="info-value dim">—</span></div>
      <div class="info-row"><span class="info-label">铭牌号</span><span class="info-value mono">SN001012</span></div>
      <div class="info-row"><span class="info-label">IMEI</span><span class="info-value mono">SN001012SN001012SN001012</span></div>
      <div class="info-row"><span class="info-label">App 版本</span><span class="info-value mono">v1.2.3</span><button class="info-action" data-href="08-device-info-updating.html">检查更新</button></div>
      <div class="info-row"><span class="info-label">网络状态</span><span class="info-value"><span class="net-ok"><i></i>在线</span></span><button class="info-action" data-href="07-device-info-testing.html">测试</button></div>
      <div class="info-row"><span class="info-label">信号强度</span><span class="info-value"><span class="sig-dots"><i></i><i></i><i></i><i></i><i class="off"></i></span></span></div>
    </div>

    <div class="adv-head">
      <span class="vs-sub-title" style="margin:0">高级设备信息</span>
      <span class="adv-note">【运维 / 工程角色能看】</span>
    </div>
    <div class="info-card">
      <div class="info-row"><span class="info-label">ICCID</span><span class="info-value mono">SN001012SN001012SN001012</span></div>
      <div class="info-row"><span class="info-label">主控版本</span><span class="info-value mono">v2.1.0</span></div>
      <div class="info-row"><span class="info-label">Android</span><span class="info-value mono">14</span></div>
      <div class="info-row"><span class="info-label">MAC</span><span class="info-value mono">XX:XX:XX:XX:XX</span></div>
      <div class="info-row"><span class="info-label">SIM 卡</span><span class="info-value">已连接</span></div>
      <div class="info-row"><span class="info-label">MDB 串口</span><span class="info-value mono">COM3</span></div>
      <div class="info-row"><span class="info-label">刷卡器串口</span><span class="info-value mono">COM4</span></div>
      <div class="info-row"><span class="info-label">现金串口</span><span class="info-value mono">COM5</span></div>
      <div class="info-row"><span class="info-label">纸硬币器</span><span class="info-value mono">COM6</span></div>
      <div class="info-row"><span class="info-label">POS 机串口</span><span class="info-value mono">COM7</span></div>
    </div>
  </main>

  <footer class="vs-footer">
    <button class="vs-save-btn" data-toast="已保存">保存</button>
  </footer>

</div>

<!-- 网络测试中弹窗 -->
<div class="vs-overlay">
  <div class="loading-modal">
    <div class="spinner"></div>
    <div class="loading-title">网络测试中...</div>
    <div class="loading-sub">请稍候</div>
    <button class="loading-cancel" data-close-hide>取消</button>
  </div>
</div>

<script src="../shared/interactions.js" defer></script>
</body>
</html>
